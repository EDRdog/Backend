spring:
  application:
    name: archiver
  config:
    import:
      - classpath:observability.yml
      - classpath:observability-metrics.yml   # 메트릭 익스포터 켜짐 (build.gradle 에 micrometer-registry-otlp 있음)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: archiver                # events 전용. alerts 는 AlertKafkaConfig 가 별도 그룹(archiver-alerts)으로 뜬다
      auto-offset-reset: earliest       # 적재는 유실 없이 처음부터 (detector 와 독립 그룹)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # events 는 Protobuf 다. 타입이 .proto 하나로 고정돼서 JsonDeserializer 처럼 대상 타입·신뢰 패키지를 따로 줄 필요가 없다.
      value-deserializer: com.edrdog.schema.EventDeserializer
      max-poll-records: 500             # INSERT 한 번에 묶이는 상한 (본문 크기·재시도 시 중복 범위를 이 선으로 제한)
      # 상한만 두면 실제로는 안 묶인다. 브로커 기본값(fetch.min.bytes=1)이라 1건만 있어도 즉시 응답해서
      # poll 이 몇 건씩만 물고 온다(실측 5건). 하한을 줘야 상한에 가까워진다(실측 219건).
      fetch-min-size: 64KB              # 이만큼 쌓일 때까지 브로커가 응답을 미룬다
      fetch-max-wait: 500ms             # 다만 이 시간을 넘기면 덜 찼어도 보낸다. 적재가 그만큼 늦어지는 상한이기도 하다
    listener:
      type: batch                       # poll 단위로 묶어 ClickHouse INSERT 1회 → 파트가 이벤트 건수만큼 안 생긴다
      observation-enabled: true         # 컨슈머 스팬 생성 → 발행 측 traceId 를 이어받아 한 트레이스로 연결
      concurrency: 3                    # 파티션 수(3)와 맞춘다. 1이면 스레드 하나가 파티션 3개를 순서대로 훑는다

server:
  port: 8083

edrdog:
  kafka:
    events-topic: events              # 원시 이벤트 (소비 입력)
    alerts-topic: alerts              # 판정기록 (소비 입력, 전용 컨슈머 그룹은 AlertKafkaConfig 참고)
  clickhouse:
    url: http://localhost:8123        # k8s NodePort HTTP
    database: edrdog
    user: edrdog
    password: ${CLICKHOUSE_PASSWORD:edrdog}   # 시크릿은 Infisical 주입, 기본값은 로컬 kind ClickHouse 와 일치
    table: edrdog.events              # events 적재 대상 테이블
    alerts-table: edrdog.alerts       # alerts 적재 대상 테이블
    # ClickHouse 로 나가는 HTTP 상한. 빼면 CH 가 느려질 때 컨슈머 스레드가 무한정 잡혀 적재가 통째로 멈춘다.
    connect-timeout-ms: ${CLICKHOUSE_CONNECT_TIMEOUT_MS:2000}
    # 적재는 최대 500건(max-poll-records) 배치 INSERT 라 조회보다 길게 잡는다. Kafka max.poll.interval.ms(기본 5분) 안쪽이라 리밸런스는 안 난다.
    read-timeout-ms: ${CLICKHOUSE_READ_TIMEOUT_MS:10000}
  # events 원본을 7일 TTL 이 지우기 전에 S3 호환 스토리지로 하루치씩 내보낸다(로컬 MinIO, 배포 S3).
  archive:
    enabled: ${ARCHIVE_ENABLED:false}   # 기본 OFF. 스토리지 없이 뜨는 로컬에서 매일 실패 로그가 쌓이지 않게 한다
    # ClickHouse 가 직접 접속하므로 CH 에서 닿는 주소여야 한다(로컬 kind 는 서비스 DNS).
    base-url: ${ARCHIVE_BASE_URL:http://minio:9000/edrdog-archive}
    access-key: ${ARCHIVE_ACCESS_KEY:}  # 시크릿은 Infisical 주입
    secret-key: ${ARCHIVE_SECRET_KEY:}
    # TTL(7일)보다 작아야 지워지기 전에 나간다. 하루 여유를 둔다.
    delay-days: ${ARCHIVE_DELAY_DAYS:6}
    cron: ${ARCHIVE_CRON:0 30 3 * * *}  # 매일 03:30. 적재가 한가한 시간대
