plugins {
    id 'org.springframework.boot' version '3.5.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.edrdog'
    version = '0.0.1-SNAPSHOT'

    // protobuf-java 와 protoc, protobuf-java-util 은 같은 버전이어야 한다. 어긋나면 런타임에 NoSuchMethodError 로 터진다.
    // 값은 Spring Boot BOM 이 관리하는 protobuf-java 버전에 맞춘다. 여기만 낮게 잡으면 BOM 이 올려 놓고
    // util 만 남아 어긋난다(실제로 그렇게 한 번 깨졌다).
    ext.protobufVersion = '4.28.3'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    // 공통 관측 설정(shared-resources/observability*.yml)을 전 서비스 클래스패스에 올린다.
    // 각 서비스 application.yml 이 spring.config.import 로 이 파일들을 가져간다.
    sourceSets.main.resources.srcDir rootProject.file('shared-resources')

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        // 분산 트레이싱 — 전 서비스 공통. Kafka 로 흩어진 이벤트 흐름을 traceId 하나로 잇는 게 목적.
        // Micrometer Observation -> OTel 브리지 -> OTLP 로 otel-lgtm(Tempo) 전송.
        // 메트릭 익스포터(micrometer-registry-otlp)는 필요한 모듈에만 개별 추가한다.
        implementation 'io.micrometer:micrometer-tracing-bridge-otel'
        implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // 뉴렐릭 에이전트 설정을 이미지 빌드 컨텍스트로 옮긴다.
    // 이미지 빌드 컨텍스트가 모듈 디렉터리라(cd.yml 의 context) Dockerfile 이 루트의 shared-resources 를
    // 직접 COPY 할 수 없다. 에이전트는 자기 jar 옆의 newrelic.yml 을 읽으므로 이미지에서 /app/newrelic.yml 이 된다.
    tasks.named('bootJar') {
        doLast {
            copy {
                from rootProject.file('shared-resources/newrelic.yml')
                into layout.buildDirectory.dir('libs')
            }
        }
    }
}
