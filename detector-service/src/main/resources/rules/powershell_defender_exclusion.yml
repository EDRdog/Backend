# 원본: rules/windows/process_creation/proc_creation_win_powershell_defender_exclusion.yml (id 17769c90-230e-488b-a463-e05c08e9d48f)
# 바꾼 것: 없음.
title: Powershell Defender Exclusion
id: 17769c90-230e-488b-a463-e05c08e9d48f
name: powershell_defender_exclusion
status: test
description: 'Detects requests to exclude files, folders or processes from Antivirus scanning using PowerShell cmdlets'
author: 'Florian Roth (Nextron Systems)'
tags:
  - attack.defense-impairment
  - attack.t1685
logsource:
  category: process_creation
detection:
  selection1:
    CommandLine|contains:
      - 'Add-MpPreference '
      - 'Set-MpPreference '
  selection2:
    CommandLine|contains:
      - ' -ExclusionPath '
      - ' -ExclusionExtension '
      - ' -ExclusionProcess '
      - ' -ExclusionIpAddress '
  condition: all of selection*
# level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
level: medium
