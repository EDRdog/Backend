# SigmaHQ rules/windows/process_creation/proc_creation_win_browsers_chromium_headless_debugging.yml 을 macOS 에 그대로 옮겼다.
# 원본은 CommandLine 만 보므로 OS 와 무관하다. 바꾼 것: logsource.product 제거, 원본 level high 를 medium 으로(ADR 020, kill 권고는 기존 다섯 개만),
# 쿠키 탈취 기법 태그 t1539 를 덧붙임. 2026-11-12 Atomic Red Team 1차 시험 A04(T1539 #3) 미탐.
title: Potential Data Stealing Via Chromium Headless Debugging
id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
name: macos_chromium_headless_debugging
status: test
description: Detects chromium based browsers starting in headless and debugging mode and pointing to a user profile. This could be a sign of data stealing or remote control
references:
  - https://github.com/defaultnamehere/cookie_crimes/
  - https://mango.pdf.zone/stealing-chrome-cookies-without-a-password
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1539/T1539.md
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-23
tags:
  - attack.credential-access
  - attack.collection
  - attack.t1185
  - attack.t1539
logsource:
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - '--remote-debugging-'
      - '--user-data-dir'
      - '--headless'
  condition: selection
falsepositives:
  - Headless browser automation (Puppeteer, Selenium) on developer machines
level: medium
