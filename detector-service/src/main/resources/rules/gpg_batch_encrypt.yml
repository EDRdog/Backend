# EDRdog 자체 룰이다. SigmaHQ 의 T1486 룰 중 gpg 를 보는 둘(gpg4win_portable_execution, renamed_gpg4win)은 이 에이전트로 옮길 수 없다.
# 하나는 설치 경로(Image|contains)로 정상을 걸러야 하는데 에이전트가 경로를 보내지 않고, 다른 하나는 OriginalFileName 만 본다.
# 그래서 실행 자체가 아니라 랜섬웨어식 사용(대화형 입력 없이 비밀번호를 주고 파일을 대칭키로 암호화)을 본다. SigmaHQ 두 룰 설명이 gpg 를 랜섬웨어의 암호화 도구로 든다.
# ART T1486 #8(Data Encrypted with GPG4Win)에 걸린다. git 커밋 서명(--status-fd=2 -bsau KEY)과 복호화에는 걸리지 않는다.
title: Batch Symmetric File Encryption Via Gpg.EXE
id: 8911bc28-e765-4e98-97ca-a2941471d240
name: gpg_batch_encrypt
status: experimental
description: 'Detects gpg.exe encrypting a file symmetrically with a passphrase given on the command line in batch mode, a way ransomware and loaders encrypt data'
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1486/T1486.md
  - https://github.com/SigmaHQ/sigma/blob/d7c9da1/rules/windows/process_creation/proc_creation_win_gpg4win_portable_execution.yml
author: 'EDRdog'
tags:
  - attack.impact
  - attack.t1486
logsource:
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\gpg.exe'
      - '\gpg2.exe'
  selection_batch:
    CommandLine|contains|all:
      - '--batch'
      - '--passphrase'
  selection_symmetric:
    CommandLine|contains:
      - ' -c '
      - '--symmetric'
  condition: all of selection_*
# 알림만 보낸다. 백업 스크립트가 같은 방식으로 암호화할 수 있다.
level: medium
