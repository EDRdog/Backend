# SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
# 원본: rules/windows/process_creation/proc_creation_win_hktl_mimikatz_command_line.yml (id a642964e-bead-4bed-8910-1bb4d63e3b4d)
# 바꾼 것: 종료(kill)를 권고하는 룰이라 오탐을 줄였다. 이름(mimikatz, DumpCreds)이나 모듈 이름(token:: 등)만 보던 조건은 빼고 module::function 쌍만 본다(git commit 메시지나 cargo test token::tests 가 걸렸다). Image 가 mimikatz.exe 인 실행을 더했다.
title: HackTool - Mimikatz Execution
id: a642964e-bead-4bed-8910-1bb4d63e3b4d
name: mimikatz_command_line
status: test
description: 'Detection well-known mimikatz command line arguments'
author: 'Teymur Kheirkhabarov, oscd.community, David ANDRE (additional keywords), Tim Shelton'
tags:
  - attack.credential-access
  - attack.t1003.001
  - attack.t1003.002
  - attack.t1003.004
  - attack.t1003.005
  - attack.t1003.006
logsource:
  category: process_creation
detection:
  selection_image:
    Image: 'mimikatz.exe'
  selection_functions:
    CommandLine|contains:
      - 'sekurlsa::logonpasswords'
      - 'sekurlsa::pth'
      - 'sekurlsa::tickets'
      - 'sekurlsa::wdigest'
      - 'sekurlsa::minidump'
      - 'sekurlsa::ekeys'
      - 'lsadump::sam'
      - 'lsadump::lsa'
      - 'lsadump::secrets'
      - 'lsadump::cache'
      - 'lsadump::dcsync'
      - 'lsadump::dcshadow'
      - 'kerberos::golden'
      - 'kerberos::ptt'
      - 'kerberos::list'
      - 'privilege::debug'
      - 'token::elevate'
      - 'dpapi::masterkey'
      - 'dpapi::cred'
      - 'crypto::capi'
      - 'crypto::certificates'
      - 'vault::cred'
      - 'vault::list'
      - 'misc::skeleton'
      - 'misc::memssp'
      - 'misc::aadcookie'
      - 'misc::detours'
      - 'misc::mflt'
      - 'misc::ncroutemon'
      - 'misc::ngcsign'
      - 'misc::printnightmare'
      - 'service::preshutdown'
      - 'ts::mstsc'
      - 'ts::multirdp'
  condition: 1 of selection_*
# level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: high
level: high
