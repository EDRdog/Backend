# EDRdog 자체 룰이다. 키체인 DB 파일(login.keychain-db)을 복사하거나 읽어 가는 명령. 기존 MACOS_KEYCHAIN_DUMP(SigmaHQ 이식)는
# security 명령과 'login-keychain' 이름만 봐서 실제 파일 이름 login.keychain-db 를 놓쳤다.
# 근거: ART T1555.001 #4(cat 으로 login.keychain-db 복사), Objective-See 2025 리뷰와 Red Canary 의 Atomic Stealer 설명(키체인 파일 수집),
#       2026-11-12 Atomic Red Team 1차 시험 A03 미탐.
title: Keychain Database File Copied By Command Line Tool
id: 4a9b2e61-8d3f-4c75-b1e0-6f2d9a7c3e18
name: macos_keychain_file_copy
status: test
description: Detects copy or read tools whose command line names a keychain database file under Library/Keychains, as macOS infostealers do before cracking it offline
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1555.001/T1555.001.md
  - https://redcanary.com/threat-detection-report/trends/mac-malware/
  - https://objective-see.org/blog/blog_0x84.html
author: EDRdog
date: 2026-11-12
tags:
  - attack.credential-access
  - attack.t1555.001
logsource:
  category: process_creation
detection:
  selection_tool:
    Image|endswith:
      - '/cat'
      - '/cp'
      - '/ditto'
      - '/rsync'
      - '/scp'
      - '/zip'
      - '/tar'
  selection_path:
    CommandLine|contains|all:
      - '/library/keychains/'
      - '.keychain-db'
  condition: selection_tool and selection_path
falsepositives:
  - Manual keychain backups with cp or ditto
level: medium
