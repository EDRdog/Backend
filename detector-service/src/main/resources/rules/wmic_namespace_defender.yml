# SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
# 원본: rules/windows/process_creation/proc_creation_win_wmic_namespace_defender.yml (id 51cbac1e-eee3-4a90-b1b7-358efb81fa0a)
# 바꾼 것: OriginalFileName 가지를 뺐다. 원본 값의 '\\\\root\\Microsoft' 는 Sigma 이스케이프라서 실제 명령행 모양인 '\\root\Microsoft' 로 풀어 썼다(이 파서는 이스케이프를 해석하지 않는다).
# ART T1685 #40(원본 표기 T1562.001)에 걸린다.
title: Potential Windows Defender Tampering Via Wmic.EXE
id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
name: wmic_namespace_defender
status: test
description: 'Detects potential tampering with Windows Defender settings such as adding exclusion using wmic'
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/5c1e6f1b4fafd01c8d1ece85f510160fc1275fbf/atomics/T1562.001/T1562.001.md
  - https://www.bleepingcomputer.com/news/security/gootkit-malware-bypasses-windows-defender-by-setting-path-exclusions/
  - https://www.bleepingcomputer.com/news/security/iobit-forums-hacked-to-spread-ransomware-to-its-members/
author: 'frack113'
tags:
  - attack.execution
  - attack.t1047
  - attack.defense-impairment
  - attack.t1685
logsource:
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\wmic.exe'
  selection_cli:
    CommandLine|contains: '/Namespace:\\root\Microsoft\Windows\Defender'
  condition: all of selection_*
# level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다(ADR 020). 원본 level: high
level: medium
