# EDRdog 자체 룰이다(SigmaHQ 원본 없음). macOS 인포스틸러(AMOS, Odyssey, MacSync)가 브라우저 저장 자격증명과 그 복호화 키를 가져가는 명령.
# 에이전트는 파일 읽기 이벤트를 못 보므로 명령행으로 판정한다(agent/README.md: eslogger exec/create/rename/unlink 만).
# 근거: Red Canary 2026-03 보고서의 스틸러 명령행 차단 문자열(login data, web data), Huntress 의 MacSync 분석
#       (osascript 가 모든 Chromium 브라우저의 Safe Storage AES 키를 로그인 키체인에서 꺼낸다),
#       ART T1555.003 #14(cp Login Data), #18(sqlite3 Login Data) 의 명령행.
# 'login data', 'web data' 는 평범한 문서 이름과 겹치므로 브라우저 프로필 경로가 같이 있어야 한다.
# security find-generic-password 는 기존 MACOS_KEYCHAIN_DUMP(find-certificate, dump-keychain)와 겹치지 않는다.
title: Browser Credential Store Or Safe Storage Key Accessed By Command Line
id: 1a16a72c-5004-4bbf-bc16-27cb83d2b771
name: macos_infostealer_browser_credentials
status: test
description: Detects a copy or read tool whose command line names a browser credential database (Login Data, Web Data, logins.json, key4.db) inside a browser profile, or security find-generic-password reading a Chromium Safe Storage key
references:
  - https://redcanary.com/threat-detection-report/trends/mac-malware/
  - https://www.huntress.com/blog/fake-claude-macsync
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1555.003/T1555.003.md
author: EDRdog
date: 2026-11-12
tags:
  - attack.credential-access
  - attack.t1555.003
logsource:
  category: process_creation
detection:
  selection_tool:
    Image|endswith:
      - '/cp'
      - '/ditto'
      - '/cat'
      - '/sqlite3'
      - '/grep'
      - '/zip'
      - '/tar'
      - '/rsync'
      - '/osascript'
  selection_store:
    CommandLine|contains:
      - 'login data'
      - 'web data'
      - 'logins.json'
      - 'key4.db'
  selection_profile:
    CommandLine|contains:
      - 'google/chrome'
      - 'brave-browser'
      - 'microsoft edge'
      - 'chromium'
      - 'firefox/profiles'
  selection_security:
    Image|endswith: '/security'
    CommandLine|contains: 'find-generic-password'
  selection_safe_storage:
    CommandLine|contains:
      - 'chrome safe storage'
      - 'chromium safe storage'
      - 'brave safe storage'
      - 'microsoft edge safe storage'
  condition: (selection_tool and selection_store and selection_profile) or (selection_security and selection_safe_storage)
falsepositives:
  - Backup or migration scripts that copy a browser profile
  - Tools that read the Chrome Safe Storage key on purpose to decrypt cookies, for example yt-dlp --cookies-from-browser and browser_cookie3
level: medium
