# SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
# 원본: rules/windows/process_creation/proc_creation_win_powershell_download_patterns.yml (id 3b6ab547-8ec2-4991-b9d2-2b06702a48d7)
# 바꾼 것: OriginalFileName 가지를 뺐다(에이전트가 보내지 않는다). ART T1105 #10, #15 의 WebClient 다운로드에 걸린다.
title: PowerShell Download Pattern
id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
name: powershell_download_patterns
status: test
description: 'Detects a Powershell process that contains download commands in its command line string'
references:
  - https://blog.redteam.pl/2020/06/black-kingdom-ransomware.html
  - https://lab52.io/blog/winter-vivern-all-summer/
  - https://hatching.io/blog/powershell-analysis/
author: 'Florian Roth (Nextron Systems), oscd.community, Jonhnathan Ribeiro'
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\powershell_ise.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cli_all:
    CommandLine|contains|all:
      - 'new-object'
      - 'net.webclient).'
      - 'download'
  selection_cli_call:
    CommandLine|contains:
      - 'string('
      - 'file('
  condition: all of selection_*
# level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다(ADR 020). 원본 level: medium
level: medium
