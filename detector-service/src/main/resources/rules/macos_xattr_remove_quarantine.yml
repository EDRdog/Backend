# SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
# 원본: rules/macos/process_creation/proc_creation_macos_xattr_gatekeeper_bypass.yml (id f5141b6d-9f42-41c6-a7bf-2a780678b29b)
# 바꾼 것: 없음(level low 는 MEDIUM 으로 매핑된다).
title: Gatekeeper Bypass via Xattr
id: f5141b6d-9f42-41c6-a7bf-2a780678b29b
name: macos_xattr_remove_quarantine
status: test
description: 'Detects macOS Gatekeeper bypass via xattr utility'
author: 'Daniil Yugoslavskiy, oscd.community'
tags:
  - attack.defense-impairment
  - attack.t1553.001
logsource:
  category: process_creation
detection:
  selection:
    Image|endswith: '/xattr'
    CommandLine|contains|all:
      - '-d'
      - 'com.apple.quarantine'
  condition: selection
# level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: low
level: medium
