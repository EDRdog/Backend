# SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
# 원본: rules/windows/process_creation/proc_creation_win_msiexec_web_install.yml (id f7b5f842-a6af-4da5-9e95-e32478f3cd2f)
# 바꾼 것: MITRE 첫 태그를 t1105 로 올렸다. 에이전트는 첫 토큰(argv0)을 실행 파일 전체 경로로 바꿔 보내므로 msiexec 앞의 공백을 뺐다(공백이 있으면 msiexec 를 직접 실행한 경우가 안 걸린다).
title: MsiExec Web Install
id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
name: msiexec_web_install
status: test
description: 'Detects suspicious msiexec process starts with web addresses as parameter'
author: 'Florian Roth (Nextron Systems)'
tags:
  - attack.command-and-control
  - attack.t1105
  - attack.stealth
  - attack.t1218.007
logsource:
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - 'msiexec'
      - '://'
  condition: selection
# level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
level: medium
