# EDRdog 자체 룰이다(SigmaHQ 원본 없음). macOS 인포스틸러(AMOS, Odyssey, MacSync)가 브라우저 쿠키 저장소를 복사하거나 읽는 명령.
# 에이전트는 파일 읽기 이벤트를 못 보므로 명령행으로 판정한다(agent/README.md: eslogger exec/create/rename/unlink 만).
# 근거: Red Canary 2026-03 보고서가 스틸러 명령행 차단 문자열로 cookies.binarycookies 를 들고, osascript 의
#       'duplicate file' + Cookies.binarycookies 를 Safari 쿠키 탈취 탐지 후보로 적는다.
#       ART T1539 #5(Atomic Stealer 방식 osascript duplicate), T1555.003 #2(CookieMiner 방식 grep)와 같은 명령행이다.
# 크롬 계열은 프로필 하위 경로(Default/Cookies, Network/Cookies)로, 파이어폭스는 cookies.sqlite 로 본다.
title: Browser Cookie Store Copied Or Read By Command Line Tool
id: 1590e11f-6db4-4426-80db-14fdeef7b42b
name: macos_infostealer_cookie_theft
status: test
description: Detects a copy, archive or read tool (cp, ditto, cat, sqlite3, grep, osascript and similar) whose command line names a browser cookie store, as macOS infostealers do when collecting session cookies
references:
  - https://redcanary.com/threat-detection-report/trends/mac-malware/
  - https://www.huntress.com/blog/fake-claude-macsync
  - https://www.sophos.com/en-us/blog/evil-evolution-clickfix-and-macos-infostealers
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1539/T1539.md
author: EDRdog
date: 2026-11-12
tags:
  - attack.credential-access
  - attack.t1539
logsource:
  category: process_creation
detection:
  selection_tool:
    Image|endswith:
      - '/cp'
      - '/ditto'
      - '/cat'
      - '/sqlite3'
      - '/grep'
      - '/zip'
      - '/tar'
      - '/rsync'
      - '/osascript'
  selection_store:
    CommandLine|contains:
      - 'cookies.binarycookies'
      - 'cookies.sqlite'
      - '/default/cookies'
      - '/network/cookies'
  condition: selection_tool and selection_store
falsepositives:
  - Backup or migration scripts that copy a browser profile, developers reading a Firefox cookies.sqlite
level: medium
