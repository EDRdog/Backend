spring:
  application:
    name: detector
  config:
    import:
      - classpath:observability.yml
      - classpath:observability-metrics.yml   # 메트릭 익스포터 켜짐 (build.gradle 에 micrometer-registry-otlp 있음)
  kafka:
    bootstrap-servers: localhost:9092
    streams:
      application-id: detector
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        num.stream.threads: 3           # events 파티션 3개를 3개 태스크로 나눠 처리 (기본 1이면 순차)
    # 데모 발행 경로: events 로 Protobuf 바이트 전송 (collector 와 같은 형식이어야 판정이 성립한다)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    # 조회 경로: alerts 를 되읽어 최근 판정 결과 보관 (RecentAlerts)
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # 발행/소비 스팬 생성 → Kafka 를 건너도 traceId 가 이어진다
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      concurrency: 3                    # 파티션 수(3)와 맞춘다. 1이면 스레드 하나가 파티션 3개를 순서대로 훑는다

server:
  port: 8081

# Streams 가 죽으면 readiness 가 DOWN 이어야 파드가 트래픽에서 빠지고 배포도 거기서 멈춘다(이슈 #214).
# liveness 는 건드리지 않는다. 리밸런싱 같은 정상 과정에서 재시작 루프에 빠질 수 있다.
# 공용 observability.yml 이 아니라 여기 두는 이유: Streams 를 쓰는 서비스는 detector 뿐이다.
management:
  endpoint:
    health:
      probes:
        enabled: true     # k8s 안에서는 자동으로 켜지지만, 로컬/테스트에서도 그룹이 뜨도록 명시한다
      group:
        readiness:
          # kafkaStreams 는 KafkaStreamsHealthIndicator 빈 이름에서 접미사를 뗀 항목 이름이다.
          # readinessState 를 같이 적어야 한다. include 를 쓰면 기본 구성원을 덮어쓴다.
          # 없는 이름을 적으면 기동이 깨지므로(NoSuchHealthContributorException) 오타는 배포 전에 드러난다.
          include: readinessState, kafkaStreams

edrdog:
  kafka:
    events-topic: events      # 검증을 거친 엔드포인트 이벤트 (판정 입력)
    alerts-topic: alerts      # SUSPECT 결과
  cep:
    # 워터마크 허용 지연. 늦게 도착하는 이벤트를 이만큼 기다린 뒤 시퀀스 룰을 판정한다.
    # 워터마크가 host 별이라 단말 내부 어긋남(밀리초 수준)만 덮으면 된다. 근거는 DetectionTopology.GRACE_MS 참고.
    # 이 값만큼 탐지가, 따라서 responder 의 kill 이 늦는다.
    # cep.event.lateness p99 와 cep.late.events 비율을 보고 확정한다.
    grace-ms: 1500
  rules:
    # 단일 이벤트 룰(Sigma 부분집합) 파일 디렉터리. 비우면 jar 에 든 번들 룰만 쓴다.
    # k8s 에서는 ConfigMap 을 여기 마운트한다(k8s/detector-service.yaml). 비었거나 못 읽으면 번들 룰이 남는다.
    dir: ${DETECTION_RULES_DIR:}
    # 파일을 다시 읽는 주기. 읽는 쪽(스트림 스레드)은 이 동안 막히지 않는다.
    reload-ms: 30000
