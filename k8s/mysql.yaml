# MySQL — 회원가입/로그인용 유저·조직 저장(edrdog), 에이전트 등록 정보 저장(edrdog_collector), 대응 명령 저장(edrdog_responder).
#   TCP 3306 -> host localhost:3306 (HTTP 아님)
#
# 볼륨이 없으면 파드가 갈릴 때마다 가입한 계정이 전부 사라진다. 배포를 안 건드려도 노드 재부팅이나 OOM 한 번이면 로그인이 안 되는 상태가 된다.
#
# 스키마를 api 용과 collector 용으로 나눈 이유: 한 테이블을 두 서비스가 직접 붙어 쓰면 스키마가
# 암묵적 계약이 되어 한쪽만 따로 배포할 수 없게 된다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql
  namespace: edrdog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: edrdog
spec:
  replicas: 1
  # RWO 라 롤링으로 두면 새 파드가 볼륨을 못 잡고 매달린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: edrdog
            - name: MYSQL_USER
              value: edrdog
            - name: MYSQL_PASSWORD
              value: edrdog
            - name: MYSQL_ROOT_PASSWORD
              value: edrdog
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: edrdog
spec:
  type: NodePort
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30306
---
# edrdog_collector·edrdog_responder 스키마 생성 Job. MYSQL_DATABASE 는 하나만 만들 수 있고, 이미 데이터가 든 배포서버의
# PVC 에는 /docker-entrypoint-initdb.d 가 아예 실행되지 않는다(데이터 디렉터리가 비어 있을 때만 도는
# mysql 이미지의 규칙이라 최초 배포 이후로는 영영 못 탄다). kafka-topic-init 과 같은 멱등 Job 으로
# 만들어야 이미 떠 있는 배포에도, 새로 만드는 클러스터에도 똑같이 먹는다.
# mysql 준비 전 실행되면 실패하므로 OnFailure + backoffLimit 로 재시도.
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-schema-init
  namespace: edrdog
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-init
          image: mysql:8.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              mysql -h mysql.edrdog.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD" -e "
                CREATE DATABASE IF NOT EXISTS edrdog_collector;
                GRANT ALL PRIVILEGES ON edrdog_collector.* TO 'edrdog'@'%';
                CREATE DATABASE IF NOT EXISTS edrdog_responder;
                GRANT ALL PRIVILEGES ON edrdog_responder.* TO 'edrdog'@'%';
                FLUSH PRIVILEGES;"
          env:
            # 엔트리포인트가 MYSQL_USER 에게는 MYSQL_DATABASE(edrdog) 에만 권한을 줘서, 새 스키마를
            # 만들려면 root 로 붙어야 한다. 비번은 mysql Deployment 의 MYSQL_ROOT_PASSWORD 와 같다.
            - name: MYSQL_ROOT_PASSWORD
              value: edrdog
