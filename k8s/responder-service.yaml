apiVersion: apps/v1
kind: Deployment
metadata:
  name: responder-service
  namespace: edrdog
  labels:
    app: responder-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responder-service
  template:
    metadata:
      labels:
        app: responder-service
    spec:
      containers:
        - name: responder-service
          # 태그는 CD 가 apply 직전에 :<sha> 로 갈아 끼운다. :latest 는 GHCR 에 안 올라가므로 이 값 그대로는 못 뜬다.
          image: ghcr.io/edrdog/backend/responder-service:latest
          ports:
            - containerPort: 8082
          # Infisical 이 동기화한 edrdog-secrets. api/alert/detector 등 다른 서비스와 같은 패턴이고, 아래 env 에 같은 이름이 있으면 그쪽이 이긴다.
          envFrom:
            - secretRef:
                name: edrdog-secrets
          env:
            # --- 실제 조치(kill) 실행 ---
            # 끄려면 이 값을 "false" 로 바꾸거나 env 를 지운다(지우면 edrdog-secrets 값이 쓰인다). 조치는 명령 큐에 넣고 에이전트가 하트비트로 가져갈 때까지 서버가 기다리며, 외부 관리 서버에 의존하지 않으므로 API 토큰이나 truststore 가 필요 없다.
            - name: RESPONDER_EXECUTE_ENABLED
              value: "true"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9094"
            # 트레이스 OTLP 전송 대상 (뉴렐릭). 인증키는 edrdog-secrets 의 NEW_RELIC_LICENSE_KEY
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "https://otlp.nr-data.net:4318"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: responder-service
  namespace: edrdog
  labels:
    app: responder-service
spec:
  selector:
    app: responder-service
  ports:
    - port: 80
      targetPort: 8082
