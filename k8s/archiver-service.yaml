# events 와 alerts 를 ClickHouse 에 그대로 적재한다. alerts 는 컨슈머 그룹 archiver-alerts 로
# 별도로 읽어서, 두 토픽을 한 그룹으로 묶었을 때 생기는 오프셋 간섭이 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archiver-service
  namespace: edrdog
  labels:
    app: archiver-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archiver-service
  template:
    metadata:
      labels:
        app: archiver-service
    spec:
      containers:
        - name: archiver-service
          # 태그는 CD 가 apply 직전에 :<sha> 로 갈아 끼운다. :latest 는 GHCR 에 안 올라가므로 이 값 그대로는 못 뜬다.
          image: ghcr.io/edrdog/backend/archiver-service:latest
          ports:
            - containerPort: 8083
          # CLICKHOUSE_PASSWORD 를 여기서 안 받으면 코드 기본값으로 붙는다. 지금은 그 값이 우연히 맞아서 돌아갈 뿐이다.
          envFrom:
            - secretRef:
                name: edrdog-secrets
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9094"
            - name: EDRDOG_CLICKHOUSE_URL
              value: "http://clickhouse:8123"
            # 메트릭/트레이스 OTLP 전송 대상 (뉴렐릭). 인증키는 edrdog-secrets 의 NEW_RELIC_LICENSE_KEY
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "https://otlp.nr-data.net:4318"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: archiver-service
  namespace: edrdog
  labels:
    app: archiver-service
spec:
  selector:
    app: archiver-service
  ports:
    - port: 80
      targetPort: 8083
