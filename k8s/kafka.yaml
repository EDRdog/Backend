# Kafka (KRaft, 단일 노드), 영속성 없음. mysql·clickhouse 와 달리 볼륨을 안 주는 이유는 여기 남는 게 아직 소비되지 않은 메시지뿐이고, 토픽은 아래 init Job 이 다시 만들기 때문이다.
# 자동 생성을 껐으므로 init Job 이 토픽을 만드는 유일한 경로다(#295). 여기에 토픽을 추가하지 않으면 그 토픽으로 보내는 쪽이 실패한다.
# 리스너 2개:
#   INTERNAL(9094) : 클러스터 내부용 -> kafka.edrdog.svc.cluster.local:9094
#   EXTERNAL(9092) : 호스트용 (localhost:9092), NodePort 30092 로 노출
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: edrdog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092  # EXTERNAL
            - containerPort: 9094  # INTERNAL
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LISTENERS
              value: "CONTROLLER://:9093,INTERNAL://:9094,EXTERNAL://:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka.edrdog.svc.cluster.local:9094,EXTERNAL://localhost:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # 자동 생성을 켜 두면 프로듀서가 아래 init Job 보다 먼저 붙는 순간 토픽이 브로커 기본값
            # (파티션 1, cleanup.policy=delete)으로 만들어지고, 그 뒤로는 아무도 못 고친다.
            # Job 의 --if-not-exists 도 Streams 도 이미 있는 토픽 설정을 안 바꾼다. 실패가 조용하다.
            # 실제로 events 가 1파티션으로 굳어 detector 의 num.stream.threads=3 이 무의미했고,
            # changelog 가 compact 를 못 받아 3.5G 로 쌓였다(#295).
            # Streams 내부 토픽은 AdminClient 로 만들어서 이걸 꺼도 영향받지 않는다.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          # 기본 힙이 -Xmx1G 라 상한이 1Gi 면 힙만으로 다 찬다. 비힙 몫까지 준다
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
---
# 클러스터 내부용 (INTERNAL 리스너)
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: edrdog
spec:
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9094
      targetPort: 9094
---
# 호스트용 (EXTERNAL 리스너, NodePort -> kind -> localhost:9092)
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: edrdog
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: external
      port: 9092
      targetPort: 9092
      nodePort: 30092
---
# 토픽 생성 Job — events / alerts
#   events : collector 가 검증한 이벤트 (detector/archiver 입력)
# kafka 준비 전 실행되면 실패하므로 OnFailure + backoffLimit 로 재시도.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: edrdog
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-init
          image: apache/kafka:3.9.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              BS=kafka.edrdog.svc.cluster.local:9094
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server $BS \
                --create --if-not-exists --topic events --partitions 3 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server $BS \
                --create --if-not-exists --topic alerts --partitions 3 --replication-factor 1
              echo "[topic-init] topics:"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server $BS --list
