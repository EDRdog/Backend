          - 'bitsadmin'
          - 'regsvr32'
          - 'cmd.exe /c '
          - 'cmd.exe /k '
          - 'cmd.exe /r '
          - 'cmd /c '
          - 'cmd /k '
          - 'cmd /r '
          - 'powershell'
          - 'pwsh'
          - 'certutil'
          - 'cscript'
          - 'wscript'
          - 'mshta'
          - '\Users\Public\'
          - '\Windows\Temp\'
          - '\AppData\Local\'
          - '%temp%'
          - '%tmp%'
          - '%ProgramData%'
          - '%appdata%'
          - '%comspec%'
          - '%localappdata%'
      condition: selection
