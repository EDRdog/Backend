    # 원본: rules/windows/process_creation/proc_creation_win_reg_dumping_sensitive_hives.yml (id fd877b94-9bb5-4191-bb25-d79cbd93c167)
    # 바꾼 것: OriginalFileName 조건과 유니코드 변형 문자열(ˢave 등)을 뺐다. 하이브 이름을 하이브 루트(HKLM\SAM 뒤가 공백이나 따옴표)로 좁혔다. 하위 키(HKLM\SAM\SAM)를 덤프하는 경우는 안 잡는다(HKLM\SYSTEM\CurrentControlSet 같은 정상 내보내기와 구분이 안 된다).
