          - ' save '
          - ' export '
      # 하이브 루트가 토큰 끝에서 끝나야 한다. 뒤가 공백이나 따옴표일 때만 SAM, SYSTEM, SECURITY 하이브 전체다.
      # \system 만 찾으면 HKLM\SYSTEM\CurrentControlSet\Services\Foo 나 HKLM\SOFTWARE\Samsung 같은 정상 내보내기가 HIGH 가 된다.
      selection_cli_hive:
        CommandLine|contains:
          - 'hklm\sam '
          - 'hklm\sam"'
          - 'hklm\system '
          - 'hklm\system"'
          - 'hklm\security '
          - 'hklm\security"'
          - 'hkey_local_machine\sam '
          - 'hkey_local_machine\sam"'
          - 'hkey_local_machine\system '
          - 'hkey_local_machine\system"'
          - 'hkey_local_machine\security '
          - 'hkey_local_machine\security"'
      condition: all of selection_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: high
    level: high
  schtasks_create_temp.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_schtasks_creation_temp_folder.yml (id 39019a4e-317f-4ce3-ae63-309a8c6b53c5)
    # 바꾼 것: level 을 high 에서 medium 으로 낮췄다(알림만). /sc once 가 명령행 끝에 오는 경우를 더했다.
    title: Suspicious Scheduled Task Creation Involving Temp Folder
    id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: schtasks_create_temp
    status: test
    description: 'Detects the creation of scheduled tasks that involves a temporary folder and runs only once'
    author: 'Florian Roth (Nextron Systems)'
    tags:
      - attack.persistence
      - attack.t1053.005
      - attack.privilege-escalation
      - attack.execution
    logsource:
      category: process_creation
    detection:
      selection_img:
        Image|endswith: '\schtasks.exe'
      selection_cli:
        CommandLine|contains|all:
          - ' /create '
          - ' /sc once '
          - '\Temp\'
      # /sc once 가 명령행 끝에 오면 뒤 공백이 없어 위 조건이 놓친다.
      selection_cli_end:
        CommandLine|contains|all:
          - ' /create '
          - '\Temp\'
        CommandLine|endswith: ' /sc once'
      condition: selection_img and 1 of selection_cli*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: high
    level: medium
  wbadmin_delete_all_backups.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_wbadmin_delete_all_backups.yml (id 639c9081-f482-47d3-a0bd-ddee3d4ecd76)
    # 바꾼 것: OriginalFileName 조건을 뺐다.
    title: All Backups Deleted Via Wbadmin.EXE
    id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: wbadmin_delete_all_backups
    status: test
    description: 'Detects the deletion of all backups or system state backups via "wbadmin.exe". This technique is used by numerous ransomware families and actors.'
    author: 'frack113, Nasreddine Bencherchali (Nextron Systems)'
    tags:
      - attack.impact
      - attack.t1490
    logsource:
      category: process_creation
    detection:
      selection_img:
        Image|endswith: '\wbadmin.exe'
      selection_cli:
        CommandLine|contains|all:
          - 'delete'
          - 'backup' # Also covers "SYSTEMSTATEBACKUP"
        CommandLine|contains: 'keepVersions:0'
      condition: all of selection_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: high
    level: high
