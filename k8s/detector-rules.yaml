# 이 파일은 scripts/gen-rules-configmap.sh 가 만든다. 직접 고치지 않는다.
# 룰은 detector-service/src/main/resources/rules/ 에서 고치고 스크립트를 다시 돌린다.
# detector 가 /etc/edrdog/rules 로 마운트해 30초마다 다시 읽는다(k8s/detector-service.yaml). 재배포 없이 반영된다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: detector-rules
  namespace: edrdog
  labels:
    app: detector-service
data:
  bcdedit_boot_tamper.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_bcdedit_susp_execution.yml (id c9fbe8e9-119d-40a6-9b59-dd58a5d84429)
    # 바꾼 것: OriginalFileName 조건을 뺐다. MITRE 첫 태그를 t1542.003 으로 올렸다.
    title: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: bcdedit_boot_tamper
    status: test
    description: 'Detects potential malicious and unauthorized usage of bcdedit.exe'
    author: '@neu5ron'
    tags:
      - attack.persistence
      - attack.t1542.003
      - attack.stealth
      - attack.t1070
    logsource:
      category: process_creation
    detection:
      selection_img:
        Image|endswith: '\bcdedit.exe'
      selection_cli:
        CommandLine|contains:
          - 'delete'
          - 'deletevalue'
          - 'import'
          - 'safeboot'
          - 'network'
      condition: all of selection_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  bitsadmin_download.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_bitsadmin_download.yml (id d059842b-6b9d-4ed1-b5c3-5b89143c6ede)
    # 바꾼 것: OriginalFileName 조건을 뺐다. MITRE 첫 태그를 t1105 로 올렸다.
    title: File Download Via Bitsadmin
    id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: bitsadmin_download
    status: test
    description: 'Detects usage of bitsadmin downloading a file'
    author: 'Michael Haag, FPT.EagleEye'
    tags:
      - attack.command-and-control
      - attack.t1105
      - attack.persistence
      - attack.execution
      - attack.stealth
      - attack.t1197
      - attack.s0190
      - attack.t1036.003
    logsource:
      category: process_creation
    detection:
      selection_img:
        Image|endswith: '\bitsadmin.exe'
      selection_cmd:
        CommandLine|contains: ' /transfer '
      selection_cli_1:
        CommandLine|contains:
          - ' /create '
          - ' /addfile '
      selection_cli_2:
        CommandLine|contains: 'http'
      condition: selection_img and (selection_cmd or all of selection_cli_*)
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  certutil_download.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_certutil_download.yml (id 19b08b1c-861d-4e75-a1ef-ea0c1baf202b)
    # 바꾼 것: OriginalFileName 조건을 뺐다(에이전트가 보내지 않는다). MITRE 첫 태그를 t1105 로 올렸다.
    title: Suspicious Download Via Certutil.EXE
    id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: certutil_download
    status: test
    description: 'Detects the execution of certutil with certain flags that allow the utility to download files.'
    author: 'Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, Nasreddine Bencherchali (Nextron Systems)'
    tags:
      - attack.command-and-control
      - attack.t1105
      - attack.stealth
      - attack.t1027
    logsource:
      category: process_creation
    detection:
      selection_img:
        Image|endswith: '\certutil.exe'
      selection_flags:
        CommandLine|contains:
          - 'urlcache '
          - 'verifyctl '
          - 'URL '
      selection_http:
        CommandLine|contains: 'http'
      condition: all of selection_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  dns_mega_userstorage.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/dns_query/dns_query_win_mega_nz.yml (id 613c03ba-0779-4a53-8a1f-47f914a4ded3)
    # 바꾼 것: 없음.
    title: DNS Query To MEGA Hosting Website
    id: 613c03ba-0779-4a53-8a1f-47f914a4ded3
    name: dns_mega_userstorage
    status: test
    description: 'Detects DNS queries for subdomains related to MEGA sharing website'
    author: 'Aaron Greetham (@beardofbinary) - NCC Group'
    tags:
      - attack.exfiltration
      - attack.t1567.002
    logsource:
      category: dns_query
    detection:
      selection:
        QueryName|contains: 'userstorage.mega.co.nz'
      condition: selection
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  dns_tor_gateway.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/dns_query/dns_query_win_tor_onion_domain_query.yml (id b55ca2a3-7cff-4dda-8bdd-c7bfa63bf544)
    # 바꾼 것: 없음(level high 는 dns 룰이라 MEDIUM 으로 깎인다).
    title: DNS Query Tor .Onion Address
    id: b55ca2a3-7cff-4dda-8bdd-c7bfa63bf544
    name: dns_tor_gateway
    status: test
    description: 'Detects DNS queries to an ".onion" address related to Tor routing networks'
    author: 'frack113'
    tags:
      - attack.command-and-control
      - attack.t1090.003
    logsource:
      category: dns_query
    detection:
      selection:
        QueryName|endswith:
          - '.hiddenservice.net'
          - '.onion.ca'
          - '.onion.cab'
          - '.onion.casa'
          - '.onion.city'
          - '.onion.direct'
          - '.onion.dog'
          - '.onion.glass'
          - '.onion.gq'
          - '.onion.ink'
          - '.onion.it'
          - '.onion.link'
          - '.onion.lt'
          - '.onion.lu'
          - '.onion.nu'
          - '.onion.pet'
          - '.onion.plus'
          - '.onion.rip'
          - '.onion.sh'
          - '.onion.to'
          - '.onion.top'
          - '.onion'
          - '.s1.tor-gateways.de'
          - '.s2.tor-gateways.de'
          - '.s3.tor-gateways.de'
          - '.s4.tor-gateways.de'
          - '.s5.tor-gateways.de'
          - '.t2w.pw'
          - '.tor2web.ae.org'
          - '.tor2web.blutmagie.de'
          - '.tor2web.com'
          - '.tor2web.fi'
          - '.tor2web.io'
          - '.tor2web.org'
          - '.tor2web.xyz'
          - '.torlink.co'
      condition: selection
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: high
    level: medium
  file_lsass_dump_name.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/file/file_event/file_event_win_lsass_default_dump_file_names.yml (id a5a2d357-1ab8-4675-a967-ef9990a59391)
    # 바꾼 것: 없음(level high 는 file 룰이라 MEDIUM 으로 깎인다).
    title: LSASS Process Memory Dump Files
    id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: file_lsass_dump_name
    status: test
    description: 'Detects creation of files with names used by different memory dumping tools to create a memory dump of the LSASS process memory, which contains user credentials.'
    author: 'Florian Roth (Nextron Systems)'
    tags:
      - attack.credential-access
      - attack.t1003.001
    logsource:
      category: file_event
    detection:
      selection_1:
        TargetFilename|endswith:
          - '\Andrew.dmp'
          - '\Coredump.dmp'
          - '\lsass.dmp'
          - '\lsass.rar'
          - '\lsass.zip'
          - '\NotLSASS.zip'  # https://github.com/CCob/MirrorDump
          - '\PPLBlade.dmp'  # https://github.com/tastypepperoni/PPLBlade
          - '\rustive.dmp' # https://github.com/safedv/RustiveDump/blob/main/src/main.rs#L35
      selection_2:
        TargetFilename|contains:
          - '\lsass_2'  # default format of procdump v9.0 is lsass_YYMMDD_HHmmss.dmp
          - '\lsassdmp'
          - '\lsassdump'
      condition: 1 of selection_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: high
    level: medium
  file_mimikatz_artifacts.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/file/file_event/file_event_win_hktl_mimikatz_files.yml (id 9e099d99-44c2-42b6-a6d8-54c3545cab29)
    # 바꾼 것: 없음(level critical 은 file 룰이라 MEDIUM 으로 깎인다).
    title: HackTool - Mimikatz Kirbi File Creation
    id: 9e099d99-44c2-42b6-a6d8-54c3545cab29
    name: file_mimikatz_artifacts
    status: test
    description: 'Detects the creation of files created by mimikatz such as ".kirbi", "mimilsa.log", etc.'
    author: 'Florian Roth (Nextron Systems), David ANDRE'
    tags:
      - attack.credential-access
      - attack.t1558
    logsource:
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
          - '.kirbi' # Kerberos tickets
          - 'mimilsa.log' # MemSSP default file
      condition: selection
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: critical
    level: medium
  macos_csrutil_disable.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/macos/process_creation/proc_creation_macos_csrutil_disable.yml (id 3603f18a-ec15-43a1-9af2-d196c8a7fec6)
    # 바꾼 것: 없음.
    title: System Integrity Protection (SIP) Disabled
    id: 3603f18a-ec15-43a1-9af2-d196c8a7fec6
    name: macos_csrutil_disable
    status: test
    description: 'Detects the use of csrutil to disable System Integrity Protection (SIP)'
    author: 'Joseliyo Sanchez, @Joseliyo_Jstnk'
    tags:
      - attack.discovery
      - attack.t1518.001
    logsource:
      category: process_creation
    detection:
      selection:
        Image|endswith: '/csrutil'
        CommandLine|contains: 'disable'
      condition: selection
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  macos_disable_security_tools.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/macos/process_creation/proc_creation_macos_disable_security_tools.yml (id ff39f1a6-84ac-476f-a1af-37fcdf53d7c0)
    # 바꾼 것: 없음.
    title: Disable Security Tools
    id: ff39f1a6-84ac-476f-a1af-37fcdf53d7c0
    name: macos_disable_security_tools
    status: test
    description: 'Detects disabling security tools'
    author: 'Daniil Yugoslavskiy, oscd.community'
    tags:
      - attack.defense-impairment
      - attack.t1685
    logsource:
      category: process_creation
    detection:
      launchctl_unload:
        Image: '/bin/launchctl'
        CommandLine|contains: 'unload'
      security_plists:
        CommandLine|contains:
          - 'com.objective-see.lulu.plist'                     # Objective-See firewall management utility
          - 'com.objective-see.blockblock.plist'               # Objective-See persistence locations watcher/blocker
          - 'com.google.santad.plist'                          # google santa
          - 'com.carbonblack.defense.daemon.plist'             # carbon black
          - 'com.carbonblack.daemon.plist'                     # carbon black
          - 'at.obdev.littlesnitchd.plist'                     # Objective Development Software firewall management utility
          - 'com.tenablesecurity.nessusagent.plist'            # Tenable Nessus
          - 'com.opendns.osx.RoamingClientConfigUpdater.plist' # OpenDNS Umbrella
          - 'com.crowdstrike.falcond.plist'                    # Crowdstrike Falcon
          - 'com.crowdstrike.userdaemon.plist'                 # Crowdstrike Falcon
          - 'osquery'                                          # facebook osquery
          - 'filebeat'                                         # elastic log file shipper
          - 'auditbeat'                                        # elastic auditing agent/log shipper
          - 'packetbeat'                                       # elastic network logger/shipper
          - 'td-agent'                                         # fluentd log shipper
      disable_gatekeeper:
        Image: '/usr/sbin/spctl'
        CommandLine|contains: 'disable'
      condition: (launchctl_unload and security_plists) or disable_gatekeeper
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  macos_dscl_add_admin.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/macos/process_creation/proc_creation_macos_dscl_add_user_to_admin_group.yml (id b743623c-2776-40e0-87b1-682b975d0ca5)
    # 바꾼 것: 없음.
    title: User Added To Admin Group Via Dscl
    id: b743623c-2776-40e0-87b1-682b975d0ca5
    name: macos_dscl_add_admin
    status: test
    description: 'Detects attempts to create and add an account to the admin group via "dscl"'
    author: 'Sohan G (D4rkCiph3r)'
    tags:
      - attack.persistence
      - attack.initial-access
      - attack.privilege-escalation
      - attack.stealth
      - attack.t1078.003
    logsource:
      category: process_creation
    detection:
      selection: # adds to admin group
        Image|endswith: '/dscl'
        CommandLine|contains|all:
          - ' -append '
          - ' /Groups/admin '
          - ' GroupMembership '
      condition: selection
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  macos_keychain_dump.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/macos/process_creation/proc_creation_macos_creds_from_keychain.yml (id b120b587-a4c2-4b94-875d-99c9807d6955)
    # 바꾼 것: 없음(Image 의 전체 경로는 파일명 일치로 읽는다).
    title: Credentials from Password Stores - Keychain
    id: b120b587-a4c2-4b94-875d-99c9807d6955
    name: macos_keychain_dump
    status: test
    description: 'Detects passwords dumps from Keychain'
    author: 'Tim Ismilyaev, oscd.community, Florian Roth (Nextron Systems)'
    tags:
      - attack.credential-access
      - attack.t1555.001
    logsource:
      category: process_creation
    detection:
      selection1:
        Image: '/usr/bin/security'
        CommandLine|contains:
          - 'find-certificate'
          - ' export '
      selection2:
        CommandLine|contains:
          - ' dump-keychain '
          - ' login-keychain '
      condition: 1 of selection*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  macos_plistbuddy_launchd_persistence.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/macos/process_creation/proc_creation_macos_persistence_via_plistbuddy.yml (id 65d506d3-fcfe-4071-b4b2-bcefe721bbbb)
    # 바꾼 것: level 을 high 에서 medium 으로 낮췄다(알림만).
    title: Potential Persistence Via PlistBuddy
    id: 65d506d3-fcfe-4071-b4b2-bcefe721bbbb
    name: macos_plistbuddy_launchd_persistence
    status: test
    description: 'Detects potential persistence activity using LaunchAgents or LaunchDaemons via the PlistBuddy utility'
    author: 'Sohan G (D4rkCiph3r)'
    tags:
      - attack.persistence
      - attack.t1543.001
      - attack.t1543.004
      - attack.privilege-escalation
    logsource:
      category: process_creation
    detection:
      selection:
        Image|endswith: '/PlistBuddy'
        CommandLine|contains|all:
          - 'RunAtLoad'
          - 'true'
        CommandLine|contains:
          - 'LaunchAgents'
          - 'LaunchDaemons'
      condition: selection
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: high
    level: medium
  macos_sysadminctl_add_admin.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/macos/process_creation/proc_creation_macos_sysadminctl_add_user_to_admin_group.yml (id 652c098d-dc11-4ba6-8566-c20e89042f2b)
    # 바꾼 것: -admin 이 명령행 끝에 오는 경우를 더했다.
    title: User Added To Admin Group Via Sysadminctl
    id: 652c098d-dc11-4ba6-8566-c20e89042f2b
    name: macos_sysadminctl_add_admin
    status: test
    description: 'Detects attempts to create and add an account to the admin group via "sysadminctl"'
    author: 'Sohan G (D4rkCiph3r)'
    tags:
      - attack.persistence
      - attack.initial-access
      - attack.privilege-escalation
      - attack.stealth
      - attack.t1078.003
    logsource:
      category: process_creation
    detection:
      selection_img:
        # Creates and adds new user to admin group
        Image|endswith: '/sysadminctl'
      selection_cli:
        CommandLine|contains|all:
          - ' -addUser '
          - ' -admin '
      # -admin 이 명령행 끝에 오면 뒤 공백이 없어 위 조건이 놓친다.
      selection_cli_end:
        CommandLine|contains: ' -addUser '
        CommandLine|endswith: ' -admin'
      condition: selection_img and 1 of selection_cli*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  macos_tmutil_delete_backup.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/macos/process_creation/proc_creation_macos_tmutil_delete_backup.yml (id 452df256-da78-427a-866f-49fa04417d74)
    # 바꾼 것: 없음.
    title: Time Machine Backup Deletion Attempt Via Tmutil - MacOS
