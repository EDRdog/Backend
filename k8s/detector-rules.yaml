# 이 파일은 scripts/gen-rules-configmap.sh 가 만든다. 직접 고치지 않는다.
# 룰은 detector-service/src/main/resources/rules/ 에서 고치고 스크립트를 다시 돌린다.
# detector 가 /etc/edrdog/rules 로 마운트해 30초마다 다시 읽는다(k8s/detector-service.yaml). 재배포 없이 반영된다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: detector-rules
  namespace: edrdog
  labels:
    app: detector-service
data:
  bcdedit_boot_tamper.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_bcdedit_susp_execution.yml (id c9fbe8e9-119d-40a6-9b59-dd58a5d84429)
    # 바꾼 것: OriginalFileName 조건을 뺐다. MITRE 첫 태그를 t1542.003 으로 올렸다.
    title: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: bcdedit_boot_tamper
    status: test
    description: 'Detects potential malicious and unauthorized usage of bcdedit.exe'
    author: '@neu5ron'
    tags:
      - attack.persistence
      - attack.t1542.003
      - attack.stealth
      - attack.t1070
    logsource:
      category: process_creation
    detection:
      selection_img:
        Image|endswith: '\bcdedit.exe'
      selection_cli:
        CommandLine|contains:
          - 'delete'
          - 'deletevalue'
          - 'import'
          - 'safeboot'
          - 'network'
      condition: all of selection_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  bitsadmin_download.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_bitsadmin_download.yml (id d059842b-6b9d-4ed1-b5c3-5b89143c6ede)
    # 바꾼 것: OriginalFileName 조건을 뺐다. MITRE 첫 태그를 t1105 로 올렸다.
    title: File Download Via Bitsadmin
    id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: bitsadmin_download
    status: test
    description: 'Detects usage of bitsadmin downloading a file'
    author: 'Michael Haag, FPT.EagleEye'
    tags:
      - attack.command-and-control
      - attack.t1105
      - attack.persistence
      - attack.execution
      - attack.stealth
      - attack.t1197
      - attack.s0190
      - attack.t1036.003
    logsource:
      category: process_creation
    detection:
      selection_img:
        Image|endswith: '\bitsadmin.exe'
      selection_cmd:
        CommandLine|contains: ' /transfer '
      selection_cli_1:
        CommandLine|contains:
          - ' /create '
          - ' /addfile '
      selection_cli_2:
        CommandLine|contains: 'http'
      condition: selection_img and (selection_cmd or all of selection_cli_*)
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  certutil_download.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_certutil_download.yml (id 19b08b1c-861d-4e75-a1ef-ea0c1baf202b)
    # 바꾼 것: OriginalFileName 조건을 뺐다(에이전트가 보내지 않는다). MITRE 첫 태그를 t1105 로 올렸다.
    title: Suspicious Download Via Certutil.EXE
    id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: certutil_download
    status: test
    description: 'Detects the execution of certutil with certain flags that allow the utility to download files.'
    author: 'Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, Nasreddine Bencherchali (Nextron Systems)'
    tags:
      - attack.command-and-control
      - attack.t1105
      - attack.stealth
      - attack.t1027
    logsource:
      category: process_creation
    detection:
      selection_img:
        Image|endswith: '\certutil.exe'
      selection_flags:
        CommandLine|contains:
          - 'urlcache '
          - 'verifyctl '
          - 'URL '
      selection_http:
        CommandLine|contains: 'http'
      condition: all of selection_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  clickfix_run_dialog_shell.yml: |
    # EDRdog 자체 룰이다. SigmaHQ 에는 대응하는 룰이 없다(ClickFix 전용 룰이 없고, Windows 로 옮길 수 있게 준비된 룰도 없었다).
    # 근거: Microsoft 보안 블로그(2025-08-21)가 설명한 ClickFix 흐름. 사용자가 실행 대화상자(Win+R)에 붙여넣은 명령을 explorer.exe 가 실행하고,
    # 자식 프로세스는 숨김 창 PowerShell(-w hidden), iex, iwr, irm, DownloadString, mshta, curl 로 원격 페이로드를 받아 실행한다.
    # ART T1204.004 #1 은 수동 시험이다. 붙여넣는 명령은 iex ((New-Object System.Net.WebClient).DownloadString('https://...')) 이다.
    # 숨김 창만으로는 걸지 않는다. 바로가기(.lnk)로 띄우는 정상 PowerShell 도 explorer.exe 가 부모라서, 숨김 창은 -c, -command, -enc 인라인 실행과 함께일 때만 본다.
    # 한계: 부모가 explorer.exe 가 아닌 경로(Windows Terminal 에 붙여넣기)는 보지 못한다. Win+R, 탐색기 주소창 변형은 본다.
    title: Potential ClickFix Paste-and-Run Shell From Explorer
    id: daa6856a-25d6-4a83-b5a4-9c9b86557feb
    name: clickfix_run_dialog_shell
    status: experimental
    description: 'Detects explorer.exe launching powershell, mshta or cmd with a download-and-execute command line or an inline hidden-window command, the process chain of ClickFix copy-and-paste social engineering'
    references:
      - https://www.microsoft.com/en-us/security/blog/2025/08/21/think-before-you-clickfix-analyzing-the-clickfix-social-engineering-technique/
      - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1204.004/T1204.004.md
    author: 'EDRdog'
    tags:
      - attack.execution
      - attack.t1204.004
    logsource:
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith: '\explorer.exe'
      selection_ps_img:
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
      selection_ps_download:
        CommandLine|contains:
          - 'invoke-expression'
          - ' iex '
          - ' iex('
          - '(iex '
          - '|iex'
          - 'downloadstring'
          - 'downloadfile'
          - 'invoke-webrequest'
          - ' iwr '
          - '(iwr '
          - ' irm '
          - '(irm '
          - 'invoke-restmethod'
          - 'net.webclient'
          - 'start-bitstransfer'
      selection_ps_hidden:
        CommandLine|contains:
          - ' -w hidden'
          - ' -windowstyle hidden'
          - ' -w h '
      selection_ps_inline:
        CommandLine|contains:
          - ' -c '
          - ' -command '
          - ' -enc'
      selection_mshta:
        Image|endswith: '\mshta.exe'
        CommandLine|contains: 'http'
      selection_cmd_img:
        Image|endswith: '\cmd.exe'
      selection_cmd_url:
        CommandLine|contains: 'http'
      selection_cmd_tool:
        CommandLine|contains:
          - 'powershell'
          - 'pwsh'
          - 'mshta'
          - 'curl '
          - 'bitsadmin'
          - 'certutil'
      condition: selection_parent and ((selection_ps_img and (selection_ps_download or (selection_ps_hidden and selection_ps_inline))) or selection_mshta or all of selection_cmd_*)
    # 알림만 보낸다. 사용자가 직접 붙여넣어 실행한 명령이라 정상 사용(개발자가 설치 한 줄 명령을 실행 대화상자에 붙여넣기)과 겹칠 수 있다.
    level: medium
  cmd_stdin_redirect.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_cmd_stdin_redirect.yml (id 241e802a-b65e-484f-88cd-c2dc10f9206d)
    # 바꾼 것: OriginalFileName 가지를 뺐다. ART T1059.003 #5 의 'cmd /r cmd<파일' 에 걸린다.
    # 감수한 오탐: cmd 명령행에 '<' 만 있으면 걸려서 'cmd /c "x < nul"' 같은 정상 스크립트도 걸린다. 알림만 보내는 medium 이라 둔다.
    title: Read Contents From Stdin Via Cmd.EXE
    id: 241e802a-b65e-484f-88cd-c2dc10f9206d
    name: cmd_stdin_redirect
    status: test
    description: 'Detect the use of "<" to read and potentially execute a file via cmd.exe'
    references:
      - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1059.003/T1059.003.md
      - https://web.archive.org/web/20220306121156/https://www.x86matthew.com/view_post?id=ntdll_pipe
    author: 'frack113, Nasreddine Bencherchali (Nextron Systems)'
    tags:
      - attack.execution
      - attack.t1059.003
    logsource:
      category: process_creation
    detection:
      selection_cmd:
        Image|endswith: '\cmd.exe'
      selection_cli:
        CommandLine|contains: '<'
      condition: all of selection_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다(ADR 020). 원본 level: medium
    level: medium
  curl_susp_download.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_curl_susp_download.yml (id e218595b-bbe7-4ee5-8a96-f32a24ad3468)
    # 바꾼 것: Product 가지를 뺐다(에이전트가 보내지 않는다). git 필터의 Image, ParentImage 는 파일명 일치로 읽힌다. ART T1105 #18 에 걸린다.
    title: Suspicious Curl.EXE Download
    id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
    name: curl_susp_download
    status: test
    description: 'Detects a suspicious curl process start on Windows and outputs the requested document to a local file'
    references:
      - https://twitter.com/max_mal_/status/1542461200797163522
      - https://web.archive.org/web/20200128160046/https://twitter.com/reegun21/status/1222093798009790464
      - https://github.com/pr0xylife/Qakbot/blob/4f0795d79dabee5bc9dd69f17a626b48852e7869/Qakbot_AA_23.06.2022.txt
      - https://www.volexity.com/blog/2022/07/28/sharptongue-deploys-clever-mail-stealing-browser-extension-sharpext/
      - https://github.com/redcanaryco/atomic-red-team/blob/0f229c0e42bfe7ca736a14023836d65baa941ed2/atomics/T1105/T1105.md#atomic-test-18---curl-download-file
    author: 'Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)'
    tags:
      - attack.command-and-control
      - attack.t1105
    logsource:
      category: process_creation
    detection:
      selection_curl:
        Image|endswith: '\curl.exe'
      selection_susp_locations:
        CommandLine|contains:
          - '%AppData%'
          - '%Public%'
          - '%Temp%'
          - '%tmp%'
          - '\AppData\'
          - '\Desktop\'
          - '\Temp\'
          - '\Users\Public\'
          - 'C:\PerfLogs\'
          - 'C:\ProgramData\'
          - 'C:\Windows\Temp\'
      selection_susp_extensions:
        CommandLine|endswith:
          - '.dll'
          - '.gif'
          - '.jpeg'
          - '.jpg'
          - '.png'
          - '.temp'
          - '.tmp'
          - '.txt'
          - '.vbe'
          - '.vbs'
      filter_optional_git_windows:
        ParentImage: 'C:\Program Files\Git\usr\bin\sh.exe'
        Image: 'C:\Program Files\Git\mingw64\bin\curl.exe'
        CommandLine|contains|all:
          - '--silent --show-error --output '
          - 'gfw-httpget-'
          - 'AppData'
      condition: selection_curl and 1 of selection_susp_* and not 1 of filter_optional_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다(ADR 020). 원본 level: high
    level: medium
  defender_disable_monitoring.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_powershell_disable_defender_av_security_monitoring.yml (id a7ee1722-c3c5-aeff-3212-c777e4733217)
    # 바꾼 것: OriginalFileName 가지를 뺐다. ART T1685 #20(sc stop WinDefend)에 걸린다. #19 는 값이 $true 가 아니라 1 이라 안 걸린다.
    title: Disable Windows Defender AV Security Monitoring
    id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: defender_disable_monitoring
    status: test
    description: 'Detects attackers attempting to disable Windows Defender using Powershell'
    references:
      - https://research.nccgroup.com/2020/06/23/wastedlocker-a-new-ransomware-variant-developed-by-the-evil-corp-group/
      - https://rvsec0n.wordpress.com/2020/01/24/malwares-that-bypass-windows-defender/
      - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
    author: 'ok @securonix invrep-de, oscd.community, frack113'
    tags:
      - attack.defense-impairment
      - attack.t1685
    logsource:
      category: process_creation
    detection:
      selection_pwsh_binary:
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
      selection_pwsh_cli:
        CommandLine|contains:
          - '-DisableBehaviorMonitoring $true'
          - '-DisableRuntimeMonitoring $true'
      selection_sc_binary:
        Image|endswith: '\sc.exe'
      selection_sc_tamper_cmd_stop:
        CommandLine|contains|all:
          - 'stop'
          - 'WinDefend'
      selection_sc_tamper_cmd_delete:
        CommandLine|contains|all:
          - 'delete'
          - 'WinDefend'
      selection_sc_tamper_cmd_disabled:
        CommandLine|contains|all:
          - 'config'
          - 'WinDefend'
          - 'start=disabled'
      condition: all of selection_pwsh_* or (selection_sc_binary and 1 of selection_sc_tamper_*)
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다(ADR 020). 원본 level: high
    level: medium
  dns_mega_userstorage.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/dns_query/dns_query_win_mega_nz.yml (id 613c03ba-0779-4a53-8a1f-47f914a4ded3)
    # 바꾼 것: 없음.
    title: DNS Query To MEGA Hosting Website
    id: 613c03ba-0779-4a53-8a1f-47f914a4ded3
    name: dns_mega_userstorage
    status: test
    description: 'Detects DNS queries for subdomains related to MEGA sharing website'
    author: 'Aaron Greetham (@beardofbinary) - NCC Group'
    tags:
      - attack.exfiltration
      - attack.t1567.002
    logsource:
      category: dns_query
    detection:
      selection:
        QueryName|contains: 'userstorage.mega.co.nz'
      condition: selection
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  dns_tor_gateway.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/dns_query/dns_query_win_tor_onion_domain_query.yml (id b55ca2a3-7cff-4dda-8bdd-c7bfa63bf544)
    # 바꾼 것: 없음(level high 는 dns 룰이라 MEDIUM 으로 깎인다).
    title: DNS Query Tor .Onion Address
    id: b55ca2a3-7cff-4dda-8bdd-c7bfa63bf544
    name: dns_tor_gateway
    status: test
    description: 'Detects DNS queries to an ".onion" address related to Tor routing networks'
    author: 'frack113'
    tags:
      - attack.command-and-control
      - attack.t1090.003
    logsource:
      category: dns_query
    detection:
      selection:
        QueryName|endswith:
          - '.hiddenservice.net'
          - '.onion.ca'
          - '.onion.cab'
          - '.onion.casa'
          - '.onion.city'
          - '.onion.direct'
          - '.onion.dog'
          - '.onion.glass'
          - '.onion.gq'
          - '.onion.ink'
          - '.onion.it'
          - '.onion.link'
          - '.onion.lt'
          - '.onion.lu'
          - '.onion.nu'
          - '.onion.pet'
          - '.onion.plus'
          - '.onion.rip'
          - '.onion.sh'
          - '.onion.to'
          - '.onion.top'
          - '.onion'
          - '.s1.tor-gateways.de'
          - '.s2.tor-gateways.de'
          - '.s3.tor-gateways.de'
          - '.s4.tor-gateways.de'
          - '.s5.tor-gateways.de'
          - '.t2w.pw'
          - '.tor2web.ae.org'
          - '.tor2web.blutmagie.de'
          - '.tor2web.com'
          - '.tor2web.fi'
          - '.tor2web.io'
          - '.tor2web.org'
          - '.tor2web.xyz'
          - '.torlink.co'
      condition: selection
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: high
    level: medium
  eventlog_clear.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_susp_eventlog_clear.yml (id cc36992a-4671-4f21-a91d-6c2b72a2edf5)
    # 바꾼 것: OriginalFileName 가지를 뺐다. 필터의 msiexec ParentImage 는 파일명 일치로 읽힌다. 이벤트 로그 지우기의 새 ATT&CK 번호는 T1685.005(옛 T1070.001)라서 옛 번호 태그를 덧붙였다.
    # ART T1685.005 #1(wevtutil cl), #2(Clear-EventLog), #4(wevtutil cl 반복)에 걸린다.
    # 감수한 오탐: 관리자의 로그 정리와 설정 변경(sl)도 걸린다. 알림만 보내는 medium 이라 둔다.
    title: Suspicious Eventlog Clearing or Configuration Change Activity
    id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: eventlog_clear
    status: stable
    description: 'Detects the clearing or configuration tampering of EventLog using utilities such as wevtutil, powershell and wmic. This technique were seen used by threat actors and ransomware strains in order to evade defenses.'
    references:
      - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.001/T1070.001.md
      - https://eqllib.readthedocs.io/en/latest/analytics/5b223758-07d6-4100-9e11-238cfdd0fe97.html
      - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
    author: 'Ecco, Daniil Yugoslavskiy, oscd.community, D3F7A5105, Swachchhanda Shrawan Poudel (Nextron Systems)'
    tags:
      - attack.defense-impairment
      - attack.t1685.005
      - attack.t1685.001
      - attack.t1070.001
      - car.2016-04-002
    logsource:
      category: process_creation
    detection:
      selection_wevtutil_img:
        Image|endswith: '\wevtutil.exe'
      selection_wevtutil_cmd:
        CommandLine|contains:
          - 'clear-log '
          - ' cl '
          - 'set-log '
          - ' sl '
          - 'lfn:'
      selection_other_ps_img:
        Image|endswith:
          - '\powershell.exe'
          - '\powershell_ise.exe'
          - '\pwsh.exe'
      selection_other_ps_cmd:
        - CommandLine|contains:
            - 'Clear-EventLog '
            - 'Remove-EventLog '
            - 'Limit-EventLog '
            - 'Clear-WinEvent '
        - CommandLine|contains|all:
            - 'Eventing.Reader.EventLogSession'
            - 'ClearLog'
        - CommandLine|contains|all:
            - 'Diagnostics.EventLog'
            - 'Clear'
      selection_other_wmi:
        Image|endswith:
          - '\powershell.exe'
          - '\powershell_ise.exe'
          - '\pwsh.exe'
          - '\wmic.exe'
        CommandLine|contains: 'ClearEventLog'
      filter_main_msiexec:
        ParentImage:
          - 'C:\Windows\SysWOW64\msiexec.exe'
          - 'C:\Windows\System32\msiexec.exe'
        CommandLine|contains: ' sl '
      condition: ((all of selection_wevtutil_*) or (all of selection_other_ps_*) or selection_other_wmi) and not 1 of filter_main_*
