  fsutil_usage.yml: |
    # SigmaHQ 룰을 이 에이전트가 보내는 필드에 맞게 옮긴 것이다. Detection Rule License 1.1, 출처는 README.md 참고.
    # 원본: rules/windows/process_creation/proc_creation_win_fsutil_usage.yml (id add64136-62e5-48ea-807e-88638d02df1e)
    # 바꾼 것: OriginalFileName 가지를 뺐다. ART T1070 #1(usn deletejournal), #2(file setZeroData)에 걸린다.
    # 감수한 오탐: 관리자의 USN 저널 조정, 파일 0 채우기도 걸린다. 알림만 보내는 medium 이라 둔다.
    title: Fsutil Suspicious Invocation
    id: add64136-62e5-48ea-807e-88638d02df1e
    name: fsutil_usage
    status: stable
    description: 'Detects suspicious parameters of fsutil (deleting USN journal, configuring it with small size, etc). Might be used by ransomwares during the attack (seen by NotPetya and others).'
    references:
      - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/fsutil-usn
      - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070/T1070.md
      - https://eqllib.readthedocs.io/en/latest/analytics/c91f422a-5214-4b17-8664-c5fcf115c0a2.html
      - https://github.com/albertzsigovits/malware-notes/blob/558898932c1579ff589290092a2c8febefc3a4c9/Ransomware/Lockbit.md
    author: 'Ecco, E.M. Anhaus, oscd.community'
    tags:
      - attack.impact
      - attack.stealth
      - attack.t1070
      - attack.t1485
    logsource:
      category: process_creation
    detection:
      selection_img:
        Image|endswith: '\fsutil.exe'
      selection_cli:
        CommandLine|contains:
          - 'deletejournal'
          - 'createjournal'
          - 'setZeroData'
      condition: all of selection_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다(ADR 020). 원본 level: high
    level: medium
  gpg_batch_encrypt.yml: |
    # EDRdog 자체 룰이다. SigmaHQ 의 T1486 룰 중 gpg 를 보는 둘(gpg4win_portable_execution, renamed_gpg4win)은 이 에이전트로 옮길 수 없다.
    # 하나는 설치 경로(Image|contains)로 정상을 걸러야 하는데 에이전트가 경로를 보내지 않고, 다른 하나는 OriginalFileName 만 본다.
    # 그래서 실행 자체가 아니라 랜섬웨어식 사용(대화형 입력 없이 비밀번호를 주고 파일을 대칭키로 암호화)을 본다. SigmaHQ 두 룰 설명이 gpg 를 랜섬웨어의 암호화 도구로 든다.
    # ART T1486 #8(Data Encrypted with GPG4Win)에 걸린다. git 커밋 서명(--status-fd=2 -bsau KEY)과 복호화에는 걸리지 않는다.
    title: Batch Symmetric File Encryption Via Gpg.EXE
    id: 8911bc28-e765-4e98-97ca-a2941471d240
    name: gpg_batch_encrypt
    status: experimental
    description: 'Detects gpg.exe encrypting a file symmetrically with a passphrase given on the command line in batch mode, a way ransomware and loaders encrypt data'
    references:
      - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1486/T1486.md
      - https://github.com/SigmaHQ/sigma/blob/d7c9da1/rules/windows/process_creation/proc_creation_win_gpg4win_portable_execution.yml
    author: 'EDRdog'
    tags:
      - attack.impact
      - attack.t1486
    logsource:
      category: process_creation
    detection:
      selection_img:
        Image|endswith:
          - '\gpg.exe'
          - '\gpg2.exe'
      selection_batch:
        CommandLine|contains|all:
          - '--batch'
          - '--passphrase'
      selection_symmetric:
        CommandLine|contains:
          - ' -c '
          - '--symmetric'
      condition: all of selection_*
    # 알림만 보낸다. 백업 스크립트가 같은 방식으로 암호화할 수 있다.
    level: medium
