        - CommandLine|contains|all:
            # The shortest form of "activate" can be "ac". But "act", "acti"...etc are also valid forms
            # Same case with the "instance" flag
            - 'ac'
            - ' i'
            - ' ntds'
      condition: all of selection_*
    # level 은 이 시스템의 대응 수준이다. high 는 프로세스 종료(kill)를 권고하므로 명백히 악성인 것만 둔다. 원본 level: medium
    level: medium
  powershell_defender_exclusion.yml: |
