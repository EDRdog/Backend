---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: edrdog
  labels:
    app: otel-lgtm
spec:
  replicas: 1
  # ReadWriteOnce PVC 라 롤링 업데이트로는 새 파드가 볼륨을 못 잡고 서로 기다린다. 먼저 내리고 띄운다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otel-lgtm
  template:
    metadata:
      labels:
        app: otel-lgtm
    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.29.2
          ports:
            - containerPort: 3000  # Grafana
            - containerPort: 3100  # Loki (Alloy 가 로그를 밀어넣는 곳)
            - containerPort: 4317  # OTLP gRPC
            - containerPort: 4318  # OTLP HTTP
            - containerPort: 9090  # Prometheus (Alloy 가 인프라 메트릭을 밀어넣는 곳)
          env:
            # 첫 화면을 EDRdog 대시보드로 (기본 Grafana 홈 대신)
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /otel-lgtm/edrdog-dashboards/edrdog-overview.json
            # 이미지 기본값이 익명 Admin 이다(run-grafana.sh). 배포서버는 Caddy 로 밖에 열려 있어서, 끄지 않으면 로그인 없이 아무나 로그·트레이스를 다 보고 대시보드도 고친다.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # optional 을 주지 않는다. 키가 없으면 익명으로 열린 채 뜨는 대신 파드가 멈춘다(kafka-ui·portainer 와 같은 이유).
            # 아이디는 admin 고정. 이 값은 grafana.db 가 없을 때만 먹으므로, 이미 쓰던 PVC 에서는 한 번 재설정해야 한다(k8s/README.md).
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edrdog-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            # 리버스 프록시 뒤라 이게 없으면 Grafana 가 만드는 절대 URL 이 localhost:3000 이 된다.
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.edrdog-api.duckdns.org
            # 기본값이 무제한이라 안 자르면 계속 쌓인다. 실측 ~63MiB/일 이라 30일이면 ~1.9GiB, size 는 안전망.
            - name: PROMETHEUS_EXTRA_ARGS
              value: --storage.tsdb.retention.time=30d --storage.tsdb.retention.size=2GB
            # Loki 14일. retention 은 compactor 가 돌리고, 켜면 delete-request-store 를 요구한다.
            - name: LOKI_EXTRA_ARGS
              value: >-
                -compactor.retention-enabled=true
                -compactor.delete-request-store=filesystem
                -compactor.working-directory=/data/loki/compactor
                -store.retention=336h
            # Tempo 6일. 기본값은 336h 이고, 3.0 부터 config 의 compactor 블록이 없어져 플래그로만 준다.
            - name: TEMPO_EXTRA_ARGS
              value: >-
                -backend-scheduler.provider.work.compaction.block-retention=144h
                -backend-worker.compaction.block-retention=144h
          # Alloy 가 인프라 메트릭을 밀어넣는 remote write 수신은 이미지 기본 실행 인자에 이미 켜져 있다(--web.enable-remote-write-receiver). PROMETHEUS_EXTRA_ARGS 로 같은 플래그를 또 주면 중복으로 Prometheus 가 아예 뜨지 않으니 넣지 말 것.
          volumeMounts:
            # 프로비저닝 디렉터리는 통째로 덮으면 기본 대시보드가 사라지므로 파일 하나만 subPath 로 얹는다.
            - name: dashboards
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/edrdog-dashboards.yaml
              subPath: edrdog-dashboards.yaml
            - name: dashboards
              mountPath: /otel-lgtm/edrdog-dashboards/edrdog-overview.json
              subPath: edrdog-overview.json
            - name: dashboards
              mountPath: /otel-lgtm/edrdog-dashboards/edrdog-http.json
              subPath: edrdog-http.json
            - name: dashboards
              mountPath: /otel-lgtm/edrdog-dashboards/edrdog-jvm-kafka.json
              subPath: edrdog-jvm-kafka.json
            - name: dashboards
              mountPath: /otel-lgtm/edrdog-dashboards/edrdog-logs-traces.json
              subPath: edrdog-logs-traces.json
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 768Mi   # 실측 유휴 ~670Mi (Grafana/Prometheus/Tempo/Loki 동시 구동)
            limits:
              memory: 2Gi
      volumes:
        - name: dashboards
          configMap:
            name: otel-lgtm-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: otel-lgtm-data
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  namespace: edrdog
  labels:
    app: otel-lgtm
spec:
  type: NodePort
  selector:
    app: otel-lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
      nodePort: 30300
    - name: loki
      port: 3100
      targetPort: 3100
      nodePort: 30310
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      nodePort: 30317
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30318
    - name: prometheus
      port: 9090
      targetPort: 9090
      nodePort: 30909
