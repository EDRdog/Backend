# 모니터링 스택 (otel-lgtm) — Grafana + Prometheus + Tempo + Loki 를 담은 올인원 이미지.
# 서비스들이 OTLP 로 메트릭/트레이스를 밀어넣고(로그·인프라 메트릭은 k8s/alloy.yaml 이 수집), Grafana 에서 본다.
#
#   기동:  kubectl apply -f k8s/otel-lgtm.yaml -f k8s/alloy.yaml
#   접속:  http://localhost:3000  (admin / GRAFANA_ADMIN_PASSWORD, 배포서버는 https://grafana.<도메인>)
#   OTLP:  호스트 실행 서비스 -> http://localhost:4318, 클러스터 내부 -> http://otel-lgtm:4318
---
# 지표 보관용 볼륨. emptyDir 로 두면 파드 재시작 때 지표·로그·트레이스가 통째로 사라져 발표 중 그래프가 빈다. 기본 StorageClass 를 쓴다(kind: standard, k3s: local-path).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otel-lgtm-data
  namespace: edrdog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-lgtm-dashboards
  namespace: edrdog
data:
  # 이미지 기본 프로비저닝(RED / JVM 대시보드)을 유지한 채 EDRdog 폴더만 추가한다.
  edrdog-dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: "EDRdog"
        type: file
        folder: "EDRdog"
        options:
          path: /otel-lgtm/edrdog-dashboards
          foldersFromFilesStructure: false

  edrdog-overview.json: |
    {
      "uid": "edrdog-overview",
      "title": "EDRdog Overview",
      "tags": [
        "edrdog"
      ],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "links": [
        {
          "type": "dashboards",
          "title": "EDRdog",
          "tags": [
            "edrdog"
          ],
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "icon": "external link"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "ds",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0
          },
          {
            "name": "job",
            "label": "service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds}"
            },
            "query": {
              "query": "label_values(jvm_threads_live, job)",
              "refId": "job"
            },
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "서비스 요약",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "요청률",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{job=~\"$job\"}[$__rate_interval]))"
            }
          ]
        },
        {
          "type": "stat",
          "id": 3,
          "title": "에러율 (5xx)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(http_server_requests_seconds_count{job=~\"$job\", outcome=\"SERVER_ERROR\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(http_server_requests_seconds_count{job=~\"$job\"}[$__rate_interval])), 0.0001)"
            }
          ]
        },
        {
          "type": "stat",
          "id": 4,
          "title": "응답시간 p95",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job=~\"$job\"}[$__rate_interval])))"
            }
          ]
        },
        {
          "type": "stat",
          "id": 5,
          "title": "Kafka 컨슈머 최대 랙",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1000
                  },
                  {
                    "color": "red",
                    "value": 10000
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(kafka_consumer_fetch_manager_records_lag_max{job=~\"$job\"} >= 0) or vector(0)"
            }
          ]
        },
        {
          "type": "row",
          "id": 6,
          "title": "트래픽",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          }
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "서비스별 요청률",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_server_requests_seconds_count{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "서비스별 에러율",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "targets": [
            {
              "expr": "(sum by (job) (rate(http_server_requests_seconds_count{job=~\"$job\", outcome=\"SERVER_ERROR\"}[$__rate_interval])) or 0 * sum by (job) (rate(http_server_requests_seconds_count{job=~\"$job\"}[$__rate_interval]))) / clamp_min(sum by (job) (rate(http_server_requests_seconds_count{job=~\"$job\"}[$__rate_interval])), 0.0001)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "응답시간 분위 (전체)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 0,
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "C"
            }
          ]
        },
        {
          "type": "row",
          "id": 10,
          "title": "리소스 / 로그",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          }
        },
        {
          "type": "timeseries",
          "id": 11,
          "title": "힙 사용률",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "targets": [
            {
              "expr": "sum by (job) (jvm_memory_used_bytes{job=~\"$job\", area=\"heap\"}) / clamp_min(sum by (job) (jvm_memory_max_bytes{job=~\"$job\", area=\"heap\"}), 1)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 12,
          "title": "Kafka 컨슈머 랙",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "targets": [
            {
              "expr": "max by (job) (kafka_consumer_fetch_manager_records_lag_max{job=~\"$job\"} >= 0)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 13,
          "title": "로그 볼륨 (레벨별)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "targets": [
            {
              "expr": "sum by (level) (count_over_time({namespace=\"edrdog\"} [$__auto]))",
              "legendFormat": "{{level}}",
              "queryType": "range",
              "refId": "A"
            }
          ]
        }
      ]
    }

