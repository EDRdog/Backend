apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: edrdog
  labels:
    app: api-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-service
          # 태그는 CD 가 apply 직전에 :<sha> 로 갈아 끼운다. :latest 는 GHCR 에 안 올라가므로 이 값 그대로는 못 뜬다.
          image: ghcr.io/edrdog/backend/api-service:latest
          ports:
            - containerPort: 8084
          # Infisical 동기화 edrdog-secrets(EDRDOG_API_KEY/INTERNAL_API_KEY/CLICKHOUSE_PASSWORD 등). 없으면 프론트 401, 알림 전면 중단, 대시보드는 ClickHouse 인증 실패로 깨진다.
          # 아래 env 에 같은 이름이 있으면 그쪽이 이긴다(그래서 DB_PASSWORD 는 아래 평문 값이 쓰인다).
          envFrom:
            - secretRef:
                name: edrdog-secrets
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka:9094"
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/edrdog"
            - name: DB_USER
              value: "edrdog"
            - name: DB_PASSWORD
              value: "edrdog"
            - name: EDRDOG_CLICKHOUSE_URL
              value: "http://clickhouse:8123"
            # 에이전트 수집 입구(collector-service) 주소. 조직 검증 등 내부 조회에 쓴다.
            - name: COLLECTOR_URL
              value: "http://collector-service"
            # 프론트 도메인(서버 실제 값과 같아야 함). CorsConfig 가 setAllowedOrigins 라 정확히 일치하는 출처만 통과한다(빠지면 브라우저만 403).
            - name: CORS_ALLOWED_ORIGINS
              value: "https://edrdog.duckdns.org,https://frontend1-ten-gamma.vercel.app,http://localhost:5173"
            # 발표 환경에서만 true(데모 계정 test/1234 + 과거 7일 시드). 배포서버가 true 라 맞췄다. 해커톤 끝나면 false 로 되돌린다.
            - name: DEMO_SEED
              value: "true"
            # 메트릭/트레이스 OTLP 전송 대상 (뉴렐릭). 인증키는 edrdog-secrets 의 NEW_RELIC_LICENSE_KEY
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "https://otlp.nr-data.net:4318"
            # GeoLite2 mmdb 를 이미지 밖(호스트 디스크)에서 읽는다. GeoIpResolver 가 이 경로를 먼저 보고, 없으면 jar 에 번들된 것으로 넘어간다.
            # 이미지 안에만 두면 MaxMind 429 로 배포 자체가 막힐 수 있고(실제로 막혔다) mmdb 없이 올리면 위협 지도가 조용히 빈다. 호스트에 두면 이미지를 갈아도 지도가 살아 있다.
            - name: GEOIP_DB_PATH
              value: "/etc/geoip/GeoLite2-Country.mmdb"
            # 설치 링크(/i/<토큰>) 주소. 둘 다 비밀이 아니라 우리 서버 주소라서 Infisical 이 아니라 여기에 둔다(사용자가 브라우저에 치는 값과 같아서 숨길 수 없다).
            # 두 값이 다른 이유: 앞(INSTALL_PUBLIC_BASE)은 Caddy 를 거치고(설치 스크립트를 curl 로 받는 곳), 뒤(INSTALL_AGENT_SERVER)는 안 거친다(에이전트가 붙는 곳). 에이전트가 서버 인증서를 고정해서 붙기 때문에 중간에서 TLS 를 다시 종단하면 등록 단계에서 실패한다.
            - name: INSTALL_PUBLIC_BASE
              value: "https://edrdog-api.duckdns.org"
            - name: INSTALL_AGENT_SERVER
              value: "edrdog-api.duckdns.org:30443"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: geoip
              mountPath: /etc/geoip
              readOnly: true
      volumes:
        # 단일 노드 k3s 라 hostPath 로 충분하다. 파일이 없어도 파드는 뜨고(DirectoryOrCreate 로 빈 디렉터리 생성) GeoIpResolver 가 jar 번들로 넘어간다(배치 절차: k8s/README.md).
        - name: geoip
          hostPath:
            path: /opt/edrdog/geoip
            type: DirectoryOrCreate
---
# 프론트/외부 API 진입점. NodePort 30084, 호스트(EC2)에서 도는 Caddy 가 localhost:30084 로 프록시한다.
# 배포서버가 이미 이 형태로 떠 있는데 한때 ClusterIP 로 남아 있어 apply 하자 NodePort 가 벗겨져 사이트가 죽었다(그래서 CD 가 이 매니페스트를 통째로 건너뛴다). 실제 상태에 맞춘 것이니 포트를 바꾸려면 Caddy 설정도 같이 바꿔야 한다.
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: edrdog
  labels:
    app: api-service
spec:
  type: NodePort
  selector:
    app: api-service
  ports:
    - port: 80
      targetPort: 8084
      nodePort: 30084
