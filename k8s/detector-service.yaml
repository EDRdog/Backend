apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector-service
  namespace: edrdog
  labels:
    app: detector-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detector-service
  template:
    metadata:
      labels:
        app: detector-service
    spec:
      containers:
        - name: detector-service
          # 태그는 CD 가 apply 직전에 :<sha> 로 갈아 끼운다. :latest 는 GHCR 에 안 올라가므로 이 값 그대로는 못 뜬다.
          image: ghcr.io/edrdog/backend/detector-service:latest
          ports:
            - containerPort: 8081
          # Infisical 동기화 edrdog-secrets. 뉴렐릭 인증키(NEW_RELIC_LICENSE_KEY) 가 여기 들어온다.
          envFrom:
            - secretRef:
                name: edrdog-secrets
          env:
            # 실제 Kafka 주소로 교체 (ConfigMap 으로 분리해도 됨)
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9094"
            # 앱의 OTLP 전송은 끈다. 관측은 전부 뉴렐릭 자바 에이전트가 맡는다.
            # cep.* 커스텀 지표는 graceMs 산정과 글쓰기용 실측 도구라 로컬에서만 쓴다(코드는 그대로 있다).
            - name: OTEL_ENABLED
              value: "false"
            # 에이전트가 붙일 APM 엔티티 이름. spring.application.name 과 맞춘다.
            - name: NEW_RELIC_APP_NAME
              value: "detector"
            # 로그도 에이전트가 보낸다(그래서 Alloy 를 뺐다). 기본값에 기대지 않고 명시한다.
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
          # 경로를 그룹별로 나눠야 Kafka Streams 항목이 readiness 에만 걸린다(이슈 #214).
          # 루트 /actuator/health 를 그대로 두면 Streams 가 죽어도 liveness 까지 DOWN 이 되어 재시작 루프에 빠진다.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: detector-service
  namespace: edrdog
  labels:
    app: detector-service
spec:
  selector:
    app: detector-service
  ports:
    - port: 80
      targetPort: 8081
