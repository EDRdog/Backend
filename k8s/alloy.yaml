# 로그 수집 (Grafana Alloy) — edrdog 네임스페이스 파드의 stdout 을 읽어 뉴렐릭으로 OTLP 전송한다.
# 앱은 건드리지 않는다. Spring 기본 로그 패턴에 이미 [traceId-spanId] 가 찍히므로 그것만 뽑아
# OTLP LogRecord 의 trace_id/span_id 로 옮기면 뉴렐릭에서 로그 -> 트레이스로 바로 넘어갈 수 있다.
#
# 운영 전용이다. 로컬 kind 는 서비스를 호스트에서 bootRun 으로 띄워 수집 대상 파드가 없고,
# 로그도 터미널에 그대로 나온다. 로컬 관측 스택은 k8s/local/otel-lgtm.yaml 이 따로 담당한다.
#
#   기동:  kubectl apply -f k8s/alloy.yaml   (전제: edrdog-secrets 에 NEW_RELIC_LICENSE_KEY)
#   확인:  New Relic > Logs (APM 서비스 화면의 Logs 탭에서 트레이스 연결 확인)
#
# DaemonSet 대신 단일 Deployment 인 이유: loki.source.kubernetes 는 노드 파일이 아니라 쿠버네티스 API 로 읽어서, DaemonSet 이면 노드마다 중복 수집한다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: edrdog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edrdog-alloy-logs
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edrdog-alloy-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edrdog-alloy-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: edrdog
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: edrdog
data:
  config.alloy: |
    // 수집 대상: edrdog 네임스페이스 파드만
    discovery.kubernetes "pods" {
      role = "pod"

      namespaces {
        names = ["edrdog"]
      }
    }

    // 파드 메타데이터를 Loki 라벨로 (카디널리티가 낮은 것만 라벨로 승격)
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // 앱 서비스만 수집. 모니터링 스택 자신(otel-lgtm, alloy)의 로그까지 담으면 볼륨 그래프가 스택 노이즈로 뒤덮인다(스택 로그는 kubectl logs 로 본다).
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = ".*-service"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "service_name"
      }
      // 파드 라벨은 archiver-service, 메트릭의 job 라벨은 archiver 라 이름이 어긋나서, -service 접미사를 떼어 양쪽을 맞춘다(로그·메트릭을 같은 이름으로 필터하려고).
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "(.*)-service"
        replacement   = "$1"
        target_label  = "service_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.spring.receiver]
    }

    loki.process "spring" {
      // 로그 레벨은 값 종류가 적으니 라벨로 (레벨별 필터/집계용)
      stage.regex {
        expression = "^\\S+\\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\\s"
      }
      stage.labels {
        values = {
          level = "",
        }
      }

      // Spring 로그 패턴의 [traceId-spanId] 를 뽑는다. structured metadata 가 아니라 라벨로 넣는 이유는
      // otelcol.receiver.loki 가 structured metadata 를 통째로 버리기 때문이다(grafana/alloy#4075).
      // 라벨은 log attribute 로 살아남고, 아래 transform 이 그걸 OTLP 네이티브 필드로 옮긴다.
      // 카디널리티를 걱정해 라벨을 피했었지만 그건 Loki 인덱스 문제고, 운영은 Loki 를 안 거친다.
      stage.regex {
        expression = "\\[(?P<trace_id>[0-9a-f]{32})-(?P<span_id>[0-9a-f]{16})\\]"
      }
      stage.labels {
        values = {
          trace_id = "",
          span_id  = "",
        }
      }

      forward_to = [otelcol.receiver.loki.newrelic.receiver]
    }

    // ---- 뉴렐릭 전송 ----
    // Loki 포맷 로그를 OTLP 로 변환한다. 인덱스 라벨은 log attribute 가 된다.
    otelcol.receiver.loki "newrelic" {
      output {
        logs = [otelcol.processor.transform.newrelic.input]
      }
    }

    // 뉴렐릭은 LogRecord 의 네이티브 trace_id/span_id 로 로그를 트레이스에 연결한다.
    // 라벨로 들어온 attribute 를 그 필드로 옮기지 않으면 로그는 가는데 연결만 조용히 빠진다.
    // service.name 은 APM 서비스 엔티티에 붙이기 위한 resource attribute 다.
    otelcol.processor.transform "newrelic" {
      error_mode = "ignore"

      log_statements {
        context = "log"
        statements = [
          `set(resource.attributes["service.name"], attributes["service_name"]) where attributes["service_name"] != nil`,
          `set(trace_id.string, attributes["trace_id"]) where attributes["trace_id"] != nil`,
          `set(span_id.string, attributes["span_id"]) where attributes["span_id"] != nil`,
        ]
      }

      output {
        logs = [otelcol.exporter.otlphttp.newrelic.input]
      }
    }

    otelcol.exporter.otlphttp "newrelic" {
      client {
        endpoint = "https://otlp.nr-data.net:4318"
        headers  = {
          "api-key" = sys.env("NEW_RELIC_LICENSE_KEY"),
        }
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: edrdog
  labels:
    app: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.18.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - containerPort: 12345  # Alloy 자체 UI (디버깅용, 노출 안 함)
          # config.alloy 의 sys.env("NEW_RELIC_LICENSE_KEY") 가 이걸 읽는다. 없으면 뉴렐릭이 403 으로 거절한다.
          envFrom:
            - secretRef:
                name: edrdog-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: alloy-config
