# 에이전트 HTTP(S) 를 직접 받는 수집 입구. 검증해 events 로 발행한다.
# 없으면 에이전트가 붙을 곳이 없어 이벤트가 아예 안 들어오고, detector/archiver 가 events 만 보므로 탐지도 대시보드도 조용해진다(수집 경로 단절).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-service
  namespace: edrdog
  labels:
    app: collector-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector-service
  template:
    metadata:
      labels:
        app: collector-service
    spec:
      containers:
        - name: collector-service
          # 태그는 CD 가 apply 직전에 :<sha> 로 갈아 끼운다. :latest 는 GHCR 에 안 올라가므로 이 값 그대로는 못 뜬다.
          image: ghcr.io/edrdog/backend/collector-service:latest
          ports:
            - containerPort: 8082
            - containerPort: 8443   # 에이전트 전용 HTTPS 커넥터 (agent-tls Secret 이 있을 때만 열린다)
          # Infisical 동기화 edrdog-secrets(DB_USER/DB_PASSWORD/INTERNAL_API_KEY 등). 없으면 이 서비스가 못 뜨거나 내부 API 호출이 401 난다.
          # 아래 env 에 같은 이름이 있으면 그쪽이 이긴다(api-service 와 같은 패턴. DB_USER/DB_PASSWORD 는 아래 평문 값이 쓰이고, INTERNAL_API_KEY 는 envFrom 값 그대로 쓰인다).
          envFrom:
            - secretRef:
                name: edrdog-secrets
          env:
            # --- 에이전트 수집 HTTPS 커넥터 ---
            # 에이전트는 서버 인증서를 고정해서 붙으므로 이 포트가 없으면 수집 자체가 불가능하다. 스위치/비번은 agent-tls Secret 에서 오고, 없으면 커넥터가 꺼진 채(기본 false) collector-service 는 그대로 정상 기동한다(생성 절차: k8s/README.md).
            - name: AGENT_TLS_ENABLED
              valueFrom:
                secretKeyRef:
                  name: agent-tls
                  key: AGENT_TLS_ENABLED
                  optional: true
            - name: AGENT_TLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-tls
                  key: AGENT_TLS_KEYSTORE_PASSWORD
                  optional: true
            # 키스토어는 아래 volume 으로 마운트된 파일을 읽는다 (Secret 없으면 이 경로도 비어 있지만 커넥터가 꺼져 있어 무해).
            - name: AGENT_TLS_KEYSTORE
              value: "/etc/agent-tls/keystore.p12"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9094"
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/edrdog_collector"
            - name: DB_USER
              value: "edrdog"
            - name: DB_PASSWORD
              value: "edrdog"
            # 조직 검증·내부 조회에 쓰는 api-service 주소
            - name: API_URL
              value: "http://api-service"
            # 확인된 조치를 넘길 responder-service 주소
            - name: RESPONDER_URL
              value: "http://responder-service"
            # 앱의 OTLP 전송은 끈다. 관측은 전부 뉴렐릭 자바 에이전트가 맡는다.
            # cep.* 커스텀 지표는 graceMs 산정과 글쓰기용 실측 도구라 로컬에서만 쓴다(코드는 그대로 있다).
            - name: OTEL_ENABLED
              value: "false"
            # 에이전트가 붙일 APM 엔티티 이름. spring.application.name 과 맞춘다.
            - name: NEW_RELIC_APP_NAME
              value: "collector"
            # 로그도 에이전트가 보낸다(그래서 Alloy 를 뺐다). 기본값에 기대지 않고 명시한다.
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: agent-tls
              mountPath: /etc/agent-tls
              readOnly: true
      volumes:
        # optional:true 라 Secret 이 없어도 파드는 뜬다(빈 디렉터리로 마운트). 그때는 커넥터도 꺼져 있다.
        - name: agent-tls
          secret:
            secretName: agent-tls
            optional: true
            items:
              - key: keystore.p12
                path: keystore.p12
---
# 내부 API 조회용. api-service 등이 이 이름으로 붙는다.
apiVersion: v1
kind: Service
metadata:
  name: collector-service
  namespace: edrdog
  labels:
    app: collector-service
spec:
  selector:
    app: collector-service
  ports:
    - port: 80
      targetPort: 8082
---
# 에이전트가 붙는 수집 포트. NodePort 30443 으로 직접 노출한다.
# Caddy 로 프록시하면 안 된다: 에이전트가 서버 인증서를 고정해서 붙어, 중간에서 TLS 를 다시 종단하면 등록 단계에서 실패한다(프록시하려면 L4 TCP 통과여야 함). EC2 보안그룹에 30443/TCP 를 열어야 외부 기기가 붙을 수 있다.
apiVersion: v1
kind: Service
metadata:
  name: collector-service-agent
  namespace: edrdog
  labels:
    app: collector-service
spec:
  type: NodePort
  selector:
    app: collector-service
  ports:
    - port: 8443
      targetPort: 8443
      nodePort: 30443
