apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: edrdog
  labels:
    app: alert-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-service
  template:
    metadata:
      labels:
        app: alert-service
    spec:
      containers:
        - name: alert-service
          # 태그는 CD 가 apply 직전에 :<sha> 로 갈아 끼운다. :latest 는 GHCR 에 안 올라가므로 이 값 그대로는 못 뜬다.
          image: ghcr.io/edrdog/backend/alert-service:latest
          ports:
            - containerPort: 8083
          # INTERNAL_API_KEY 를 여기서 안 받으면 코드 기본값(dev-internal-key)으로 붙어, api-service 가 401 을 낸다.
          envFrom:
            - secretRef:
                name: edrdog-secrets
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9094"
            # tenant Slack webhook 조회용 api-service 내부 엔드포인트 (Service port 80)
            - name: EDRDOG_API_BASE_URL
              value: "http://api-service"
            # 앱의 OTLP 전송은 끈다. 관측은 전부 뉴렐릭 자바 에이전트가 맡는다.
            # cep.* 커스텀 지표는 graceMs 산정과 글쓰기용 실측 도구라 로컬에서만 쓴다(코드는 그대로 있다).
            - name: OTEL_ENABLED
              value: "false"
            # 에이전트가 붙일 APM 엔티티 이름. spring.application.name 과 맞춘다.
            - name: NEW_RELIC_APP_NAME
              value: "alert"
            # 로그도 에이전트가 보낸다(그래서 Alloy 를 뺐다). 기본값에 기대지 않고 명시한다.
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
          # 뉴렐릭 자바 에이전트가 기동에 시간을 얹어서 liveness(30s + 20s*3)가 먼저 파드를 죽였다(#226).
          # initialDelaySeconds 를 늘리면 기동 후 장애 감지까지 계속 둔해진다. startupProbe 는 기동 중에만
          # 봐주고 통과하는 즉시 원래 프로브가 제 간격으로 돌아온다.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 10
            failureThreshold: 30          # 최대 300초까지 기다린다
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              # 512Mi 는 뉴렐릭 자바 에이전트를 붙이기 전 기준이었다. 붙이고 나서 실측이 collector 495Mi,
              # api 472Mi, detector 468Mi 로 상한의 90%를 넘겼다. 늘어난 건 힙이 아니라 비힙
              # (에이전트, 메타스페이스, 스레드)이라 -Xmx 로 눌러도 안 줄어든다.
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: edrdog
  labels:
    app: alert-service
spec:
  selector:
    app: alert-service
  ports:
    - port: 80
      targetPort: 8083
