name: CD

on:
  push:
    branches: [main]

jobs:
  # 어느 모듈을 다시 구울지 고른다. 이미지 빌드가 QEMU 멀티아치라 모듈당 수 분씩 드는데,
  # README 한 줄 고친 배포에도 6개를 다 굽고 있었다. 배포(apply)는 전부 하되 굽는 것만 줄인다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      # git diff 로 직접 비교하므로 전체 히스토리가 필요하다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # dorny/paths-filter 를 썼다가 뺐다. 그 액션의 기본 base 는 레포 기본 브랜치(dev)인데,
      # main push 는 항상 dev 를 머지해서 생기니 dev...main 차이가 언제나 0 이다. 결과가 늘 비어
      # 아무것도 안 구워지고 옛 이미지로 배포되는데, CD 는 초록불이라 아무도 모른다.
      - id: list
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          ALL='["detector-service","responder-service","archiver-service","api-service","alert-service","collector-service"]'
          # 판단이 안 서면 전부 굽는다. 느린 배포가 낡은 이미지 배포보다 낫다.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "직전 커밋($BEFORE)을 못 찾아 전 모듈을 다시 굽는다" >&2
            echo "modules=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILES=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "바뀐 파일:" >&2; echo "$FILES" | sed 's/^/  /' >&2
          # 공통 파일은 어느 모듈이 영향받을지 알 수 없으므로 전부 굽는다.
          if echo "$FILES" | grep -qE '^(build\.gradle|settings\.gradle|gradlew|gradle/|\.github/workflows/cd\.yml)'; then
            echo "공통 파일이 바뀌어 전 모듈을 다시 굽는다" >&2
            echo "modules=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          MODS=$(echo "$FILES" | awk -F/ '{print $1}' | sort -u \
            | grep -E '^(detector|responder|archiver|api|alert|collector)-service$' || true)
          MODULES=$(jq -Rc -s 'split("\n") | map(select(length > 0))' <<<"$MODS")
          echo "다시 구울 모듈: $MODULES" >&2
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

  # 빌드 + 테스트 후 boot jar 를 다음 잡으로 넘긴다 (바뀐 모듈만)
  # settings.gradle 의 모듈끼리 의존이 하나도 없어서(project(...) 참조 0건) 모듈별로 잘라 돌려도
  # 놓치는 깨짐이 없다. 공통 파일(build.gradle, gradle/**)이 바뀌면 shared 필터가 전 모듈을 태운다.
  build:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # GeoLite2 mmdb 캐시. MaxMind 는 짧은 시간에 여러 번 받으면 429 를 준다(실제로 배포가 막혔다). DB 는 주 단위로 갱신되므로 주차 키로 캐시하면 하루에 몇 번을 빌드해도 한 번만 받는다.
      - name: GeoLite2 캐시
        uses: actions/cache@v4
        with:
          path: api-service/build/geoip
          key: geolite2-${{ hashFiles('api-service/build.gradle') }}-week
          restore-keys: geolite2-
      - name: Build + test
        # GeoLite2 mmdb 는 빌드 시점에 받아 jar 에 번들된다. 이 키가 없으면 다운로드를 건너뛰고 빌드는 그대로 성공하지만, 런타임에 GET /api/events/geo 가 항상 빈 배열을 준다(위협 지도가 빈다).
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          MODULES_JSON: ${{ needs.changes.outputs.modules }}
        # 모듈을 따로 돌리지 않고 태스크만 나열해 한 번에 넘긴다. gradle 기동 비용을 한 번만 낸다.
        run: ./gradlew $(jq -r 'map(":\(.):build") | join(" ")' <<<"$MODULES_JSON")
      - name: Strip plain jars
        run: find . -name '*-plain.jar' -delete
      - name: Upload boot jars
        uses: actions/upload-artifact@v4
        with:
          name: boot-jars
          # 안 바꾼 모듈은 굽지도 않으니 jar 가 없다. 없는 경로는 넘어간다.
          if-no-files-found: ignore
          path: |
            detector-service/build/libs/*.jar
            responder-service/build/libs/*.jar
            archiver-service/build/libs/*.jar
            api-service/build/libs/*.jar
            alert-service/build/libs/*.jar
            collector-service/build/libs/*.jar

  # 이미지 빌드 + GHCR 푸시 (바뀐 모듈만)
  image:
    needs: [changes, build]
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # 한 모듈이 실패해도 나머지는 계속 빌드한다. Docker Hub 에서 베이스 이미지를 받다가 네트워크 타임아웃이 나면(실제로 발생했다) fail-fast 가 멀쩡한 모듈까지 취소시킨다.
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boot-jars
      - id: vars
        run: echo "image_base=ghcr.io/${IMAGE,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ github.repository }}/${{ matrix.module }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 배포서버가 오라클 Ampere A1 이라 amd64 만 올리면 exec format error 로 하나도 안 뜬다.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }}
          platforms: linux/amd64,linux/arm64
          push: true
          # :latest 는 안 민다. 배포는 :sha 로만 하는데 :latest 가 같이 있으면, 손배포하는 사람이
          # 그걸 집어 자기도 모르게 다른 버전을 띄운다(Infisical Operator 가 :latest 드리프트로 죽어 있었다).
          tags: ${{ steps.vars.outputs.image_base }}:${{ github.sha }}

  # 배포서버(k3s) 에 SSH 로 접속해 k8s/ 매니페스트와 호스트 Caddy 설정을 통째로 넣는다. k3s API 를 외부에 노출하지 않는다.
  # 필요한 secret: EC2_HOST(도메인/공인IP), EC2_SSH_KEY(개인키). 선택: EC2_USER(기본 ubuntu).
  # 서비스 환경변수(OTEL_EXPORTER_OTLP_ENDPOINT 등)는 Infisical 로 주입한다.
  #
  # 바뀐 모듈이 없으면 build·image 가 둘 다 skip 되는데, needs 만 두면 deploy 까지 딸려 skip 된다.
  # 매니페스트만 고친 배포도 서버에 가야 하므로 "실패" 했을 때만 멈춘다(skip 은 통과시킨다).
  deploy:
    needs: [changes, build, image]
    if: ${{ !cancelled() && needs.build.result != 'failure' && needs.image.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BUILT_JSON: ${{ needs.changes.outputs.modules }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # GHCR 는 소문자 경로만 받으므로 repo 이름을 소문자로 바꿔 원격에 넘긴다.
          REPO_LC="${REPO,,}"
          # 이번에 실제로 구운 모듈. 나머지는 지금 떠 있는 태그를 그대로 유지한다.
          BUILT=$(jq -r 'join(" ")' <<<"$BUILT_JSON")
          # ServerAliveInterval 이 없으면 rollout status 로 몇 분 조용히 기다리는 동안 세션이 Broken pipe 로 끊긴다(실제로 배포가 서비스 롤링 직전에 죽었다).
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "REPO='$REPO_LC' SHA='$SHA' BUILT='$BUILT' NS=edrdog bash -s" <<'REMOTE'
          set -euo pipefail
          MODULES="detector-service responder-service archiver-service api-service alert-service collector-service"

          # 인프라 매니페스트는 목록을 적지 않고 k8s/ 를 훑어서 전부 적용한다. 파일을 추가할 때마다 여기도 같이 고쳐야 하면 잊게 되고, 그러면 서버에만 빠진 채로 조용히 지나간다(실제로 portainer.yaml 이 그랬다).
          #   빼는 것: *-service.yaml 은 아래에서 이미지 태그를 끼워 넣어 따로 apply 한다.
          #            kind-cluster.yaml 은 로컬 kind 설정이라 apply 대상이 아니고,
          #            infisical.yaml 은 CRD 가 있을 때만 적용한다(바로 아래).
          # 서버 브랜치를 건드리지 않으려고 FETCH_HEAD 에서 파일만 꺼내 적용한다.
          # 매니페스트는 전부 이 클론에서 꺼낸다. 없으면 apply 를 통째로 건너뛰게 되는데, 그걸 경고로만
          # 넘기면 서버가 옛 설정인 채로 배포가 초록불로 끝난다. 오늘 우리를 세 번 문 유형이라 여기서 죽인다.
          if [ ! -d ~/Backend/.git ]; then
          echo "서버에 ~/Backend 클론이 없어 매니페스트를 꺼낼 수 없다. 배포를 중단한다." >&2
          echo "  git clone https://github.com/EDRdog/Backend.git ~/Backend" >&2
          exit 1
          fi

          INFRA_FAILED=""
          git -C ~/Backend fetch --quiet origin main
          INFRA_DEPLOYS=""
          for f in $(git -C ~/Backend ls-tree --name-only FETCH_HEAD k8s/ | grep '\.yaml$'); do
          case "$(basename "$f" .yaml)" in *-service|kind-cluster|infisical) continue ;; esac
          echo "apply $f" >&2
          MANIFEST=$(git -C ~/Backend show "FETCH_HEAD:$f")
          # Job 은 spec.template 이 immutable 이라 내용이 바뀌면 apply 가 "field is immutable" 로 죽는다.
          # 그러면 set -e 때문에 뒤따르는 mysql apply 와 서비스 롤링까지 통째로 안 돈다(실제로 토픽 생성
          # Job 에서 events-raw 줄을 지웠을 때 배포가 여기서 멈췄다). 여기 있는 Job 은 부트스트랩용이라
          # 다시 돌려도 안전하므로 지우고 새로 만든다. --dry-run=client 로는 안 잡힌다(서버의 기존
          # 오브젝트와 대조하지 않는다). 파일 목록을 따로 적지 않는 이유는 위 apply 규칙과 같다.
          EXISTING_JOBS=$(echo "$MANIFEST" | sudo kubectl get -f - -o name 2>/dev/null | grep '^job\.batch/' || true)
          if [ -n "$EXISTING_JOBS" ]; then
          echo "$EXISTING_JOBS 을(를) 지우고 다시 만든다 (Job 은 수정 불가)" >&2
          echo "$EXISTING_JOBS" | xargs sudo kubectl -n "$NS" delete --ignore-not-found
          fi
          APPLIED=$(echo "$MANIFEST" | sudo kubectl apply -f - -o name)
          echo "$APPLIED" >&2
          INFRA_DEPLOYS="$INFRA_DEPLOYS $(echo "$APPLIED" | grep '^deployment' || true)"
          done

          # 호스트의 Caddy 설정. k8s 밖이라 kubectl 로는 안 닿아서, 여기서 안 하면 아무도 조정하지 않는 유일한 조각으로 남는다.
          # 실제로 레포에 portainer 블록을 넣고도 서버는 계속 모른 채였고, 서브도메인이 인증서가 없어 TLS 핸드셰이크부터 깨졌다.
          CADDYFILE=$(mktemp)
          if ! git -C ~/Backend show "FETCH_HEAD:scripts/Caddyfile" > "$CADDYFILE" 2>/dev/null || [ ! -s "$CADDYFILE" ]; then
          # 빈 파일도 validate 는 통과한다. 그대로 넣고 reload 하면 사이트가 통째로 사라지므로 여기서 막는다.
          echo "scripts/Caddyfile 을 못 꺼냈다" >&2
          INFRA_FAILED="$INFRA_FAILED caddy"
          elif ! caddy validate --config "$CADDYFILE" --adapter caddyfile >/dev/null 2>&1; then
          # 틀린 설정을 넣고 reload 하면 사이트가 통째로 죽는다. 넣지 않고 옛 설정으로 두는 편이 낫다.
          echo "Caddyfile 이 잘못돼 적용하지 않는다" >&2
          INFRA_FAILED="$INFRA_FAILED caddy"
          elif sudo cmp -s "$CADDYFILE" /etc/caddy/Caddyfile; then
          echo "Caddyfile 그대로" >&2
          else
          sudo install -m 644 "$CADDYFILE" /etc/caddy/Caddyfile
          # reload 는 설정만 다시 읽어서 연결이 안 끊긴다. 새 도메인이면 여기서 인증서를 받느라 첫 접속이 잠깐 늦다.
          sudo systemctl reload caddy || INFRA_FAILED="$INFRA_FAILED caddy"
          echo "Caddyfile 갱신 후 reload" >&2
          fi
          rm -f "$CADDYFILE"

          # Infisical 연동은 Operator 가 깔려 있을 때만 한다. 없으면 CRD 가 없어 apply 가 실패하고 set -e 때문에 서비스 롤링까지 같이 죽는다.
          # 슬러그가 플레이스홀더면 apply 하지 않는다. 그대로 밀면 서버에 제대로 들어가 있던 설정을 덮어써서
          # Operator 가 인증을 못 하게 되고, 시크릿이 조용히 낡아간다(실제로 하루 동안 그랬다).
          if sudo kubectl get crd infisicalsecrets.secrets.infisical.com >/dev/null 2>&1; then
          INFISICAL_YAML=$(git -C ~/Backend show "FETCH_HEAD:k8s/infisical.yaml")
          if echo "$INFISICAL_YAML" | grep -q REPLACE_WITH_INFISICAL_PROJECT_SLUG; then
          echo "k8s/infisical.yaml 의 projectSlug 가 아직 플레이스홀더라 apply 를 건너뛴다" >&2
          else
          echo "$INFISICAL_YAML" | sudo kubectl apply -f -
          fi
          fi
          # 인프라가 안 떠도 여기서 멈추지 않는다. kafka-ui·portainer 는 시크릿이 없으면 일부러 안 뜨는데, 운영 UI 때문에 앱 배포가 막히면 곤란해서 대신 맨 끝에서 CD 를 실패시킨다.
          for d in $INFRA_DEPLOYS; do
          # 60s 인 이유: 못 뜰 인프라를 5분씩 기다려봐야 결론이 같고, 그만큼 서비스 배포만 늦어진다.
          sudo kubectl -n "$NS" rollout status "$d" --timeout=60s || INFRA_FAILED="$INFRA_FAILED $d"
          done

          # 서비스도 매니페스트를 apply 한다. set image 만 하면 env·envFrom·probe·리소스 변경이 서버에
          # 영영 안 간다. 머지도 CD 도 초록불인데 서버만 옛 설정으로 남고, 짝이 되는 다른 변경이 반영될 때
          # 터진다(archiver-service 의 envFrom 이 이렇게 누락돼 CrashLoopBackOff 가 났다).
          #
          # 이미지 태그는 매니페스트의 placeholder 를 쓰지 않고 여기서 끼워 넣는다.
          #   이번에 구운 모듈  -> :$SHA
          #   안 구운 모듈      -> 지금 떠 있는 태그 그대로 (그 :$SHA 이미지는 아예 없다)

          # 레포에서 없앤 리소스는 여기 적어야 서버에서도 사라진다. apply 는 매니페스트에 없는 것을
          # 지우지 않아서, 그냥 두면 서버에만 유령으로 남는다. NodePort 처럼 클러스터에서 하나뿐인
          # 자원을 쥐고 있으면 새 Service 가 "port is already allocated" 로 아예 안 만들어진다.
          # api-service-agent: 수집 입구가 collector 로 가면서 30443 이 collector-service-agent 로
          #   옮겨갔는데, 옛 Service 가 그 포트를 붙들고 있었다(#184).
          # 배포서버에서 한 번 지워지고 나면 이 줄은 없어도 된다. 그래도 남겨 두는 편이 안전하다.
          # 클러스터를 새로 세우면 없는 이름이라 --ignore-not-found 로 조용히 지나간다.
          sudo kubectl -n "$NS" delete service api-service-agent --ignore-not-found

          DEPLOYED=""
          for m in $MODULES; do
          CUR=$(sudo kubectl -n "$NS" get deploy "$m" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          case " $BUILT " in
          *" $m "*) TAG="$SHA" ;;
          *) TAG="${CUR##*:}"; [ -n "$CUR" ] || TAG="$SHA" ;;
          esac
          echo "apply k8s/$m.yaml (:${TAG})" >&2
          git -C ~/Backend show "FETCH_HEAD:k8s/$m.yaml" \
          | sed "s#^\( *\)image: ghcr.io/.*#\1image: ghcr.io/$REPO/$m:$TAG#" \
          | sudo kubectl apply -f -
          DEPLOYED="$DEPLOYED $m"
          done

          for m in $DEPLOYED; do
          sudo kubectl -n "$NS" rollout status "deployment/$m" --timeout=120s
          done

          # rollout status 는 파드가 떴는지만 본다. archiver 는 ClickHouse 연결이 깨져도 예외를 삼키고
          # /actuator/health 는 그대로 UP 이라(CH 항목이 없다) 판정기록이 하나도 안 쌓이는 채로 배포가
          # 초록으로 끝난다. 실제로 비번이 갈려 alerts 테이블이 안 만들어진 걸 몇 시간 뒤에야 알았다.
          # 그래서 부팅했으면 반드시 참이어야 할 사실 하나를 직접 확인한다.
          # alerts 테이블을 만드는 주체가 api-service 에서 archiver-service 로 옮겨왔다(이슈 #184).
          SMOKE_FAILED=""
          case " $DEPLOYED " in *" archiver-service "*)
          CHPW=$(sudo kubectl -n "$NS" get secret edrdog-secrets -o jsonpath='{.data.CLICKHOUSE_PASSWORD}' 2>/dev/null | base64 -d 2>/dev/null || true)
          [ -n "$CHPW" ] || CHPW=edrdog
          if ! sudo kubectl -n "$NS" exec deploy/clickhouse -- \
          clickhouse-client --user edrdog --password "$CHPW" -q "EXISTS TABLE edrdog.alerts" 2>/dev/null | grep -qx 1; then
          SMOKE_FAILED="archiver-service 가 떴는데 edrdog.alerts 테이블이 없다. ClickHouse 인증/연결을 확인한다(로그: ClickHouse alerts 스키마 준비 실패)."
          fi
          ;;
          esac

          # 앱은 다 올린 뒤에 인프라 실패를 알린다. 여기서 죽어야 CD 가 초록으로 안 끝난다.
          if [ -n "$SMOKE_FAILED" ]; then
          echo "배포 후 점검 실패: $SMOKE_FAILED" >&2
          fi
          if [ -n "$INFRA_FAILED" ] || [ -n "$SMOKE_FAILED" ]; then
          [ -z "$INFRA_FAILED" ] || echo "인프라 롤아웃 실패:$INFRA_FAILED" >&2
          [ -z "$INFRA_FAILED" ] || echo "kafka-ui·portainer 라면 edrdog-secrets 에 계정 키가 없는 것이다(k8s/README.md)." >&2
          [ -z "$INFRA_FAILED" ] || echo "caddy 라면 scripts/Caddyfile 이 잘못됐거나 reload 가 실패한 것이다. 서버 설정은 옛 상태 그대로다." >&2
          exit 1
          fi
          REMOTE
