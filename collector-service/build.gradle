// Collector — 에이전트 HTTP 수집 입구. 인증·검증 후 detector 스키마(Event)로 events 에 발행
dependencies {
    implementation project(':event-schema')                             // events 스키마(.proto 생성 클래스) + Serializer
    // 루트 build.gradle 이 actuator 를 넣지만 web 이 없으면 HTTP 서버 자체가 안 떠서
    // /actuator/health 가 서빙되지 않는다(k8s probe 가 계속 실패해 컨테이너가 재시작된다).
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.micrometer:micrometer-registry-otlp'            // 메트릭 OTLP 전송. 수집 입구만 앱 지표가 없어 EDRdog HTTP/Resources 대시보드에서 빠져 있었다
    implementation 'com.fasterxml.jackson.core:jackson-databind'        // 에이전트가 보낸 검증 전 원본 JSON 파싱 (발행은 Protobuf)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'    // 등록 노드(node_key 해시 → tenant/host) 저장
    runtimeOnly 'com.mysql:mysql-connector-j'                           // 등록 노드 저장용 MySQL 드라이버
    testImplementation 'com.h2database:h2'                              // 수집 흐름 통합 테스트용 임베디드 DB
    // Kafka 헤더에 traceparent 가 실제로 실리는지 보려면 브로커가 있어야 한다(이슈 #235).
    // 설정만 보고 "되겠지" 했다가 배포를 두 번 헛돌렸다(#229, #232).
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}
