spring:
  application:
    name: collector
  config:
    import:
      - classpath:observability.yml
      - classpath:observability-metrics.yml   # 메트릭 익스포터 켜짐 (build.gradle 에 micrometer-registry-otlp 있음)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/edrdog_collector}
    username: ${DB_USER:edrdog}
    password: ${DB_PASSWORD:edrdog}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:                           # 검증 통과분(Event Protobuf 바이트)을 events 로 발행
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 직렬화는 EventsProducer 가 event.toByteArray() 로 이미 끝낸다. 여기서는 바이트를 그대로 흘린다.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      # 압축은 레코드 배치 단위로 동작한다. 배치가 안 모이면 켜 봐야 압축률이 나쁘고 헤더만 붙는다.
      # publish() 는 건당 호출이지만 한 요청의 500건이 같은 루프에서 나가므로 5ms 면 다 모인다.
      # send() 가 비동기라 HTTP 응답은 안 기다린다. 늘어나는 건 발행→소비 지연뿐이다(kafkaLagMs).
      batch-size: 131072                # 기본 16KB 면 한 요청이 열 배치로 쪼개진다. host 키라 한 파티션으로 몰린다
      # 500건 한 배치에서 58,372 → 12,325 바이트(78.9% 감소)다. 건당 한 배치면 4.3% 늘어난다.
      # 그래서 위의 batch-size·linger 없이 이 줄만 켜면 손해다.
      # 같은 배치에서 gzip 이 1KB 더 줄지만 detector 가 Streams 로 상시 소비해 해제 CPU 가 계속 든다.
      compression-type: zstd
      properties:
        linger.ms: 5
    # 발행 스팬 생성 → Kafka 를 건너도 traceId 가 이어진다
    template:
      observation-enabled: true

server:
  port: 8082

edrdog:
  kafka:
    events-topic: events                # 검증 통과 이벤트 (발행 출력, detector/archiver 입력)
  agent:
    tls:                                # 에이전트 전용 HTTPS 커넥터 (내부 HTTP 8082 와 별도 포트)
      enabled: ${AGENT_TLS_ENABLED:false}            # 켜면 keystore 필수 (scripts/gen-dev-keystore.sh)
      port: ${AGENT_TLS_PORT:8443}
      keystore: ${AGENT_TLS_KEYSTORE:}               # PKCS12 경로 또는 classpath:...
      keystore-password: ${AGENT_TLS_KEYSTORE_PASSWORD:changeit}
      keystore-type: PKCS12
      key-alias: ${AGENT_TLS_KEY_ALIAS:agent}
  internal:
    key: ${INTERNAL_API_KEY:dev-internal-key}        # 서비스 간 조회 전용 키 (X-Internal-Key 헤더, api-service 와 같은 값)
  api:
    url: ${API_URL:http://api-service}               # enroll secret → tenant 조회 대상. 로컬은 http://localhost:8084
  responder:
    url: ${RESPONDER_URL:http://responder-service}   # 대기 명령 조회·결과 전달 대상(ClusterIP)
