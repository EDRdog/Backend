spring:
  application:
    name: responder
  config:
    import:
      - classpath:observability.yml
      # 메트릭 익스포터 꺼짐: observability-metrics.yml 을 넣지 않는다.
      # micrometer-registry-otlp 가 없는 서비스라 트레이스만 보낸다(메트릭은 api/detector/archiver 에만).
  datasource:                           # 명령 저장. 인스턴스 여러 대가 같은 명령을 본다
    url: ${DB_URL:jdbc:mysql://localhost:3306/edrdog_responder}
    username: ${DB_USER:edrdog}
    password: ${DB_PASSWORD:edrdog}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: responder
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.edrdog.responderservice.dto.Alert
        spring.json.trusted.packages: com.edrdog.responderservice.dto
    listener:
      observation-enabled: true         # 컨슈머 스팬 생성 → 발행 측 traceId 를 이어받아 한 트레이스로 연결
      concurrency: 3                    # 파티션 수(3)와 맞춘다. 1이면 스레드 하나가 파티션 3개를 순서대로 훑는다

server:
  port: 8082

edrdog:
  kafka:
    alerts-topic: alerts        # detector 가 발행한 판정 결과 (소비 입력)
  responder:
    cooldown-ms: 60000          # 같은 host+action 중복 표시 / 재조치 억제 창
    execute:
      enabled: ${RESPONDER_EXECUTE_ENABLED:false}  # 실제 조치 실행 스위치 (기본 OFF = dry-run 유지)
    command:
      timeout-ms: ${RESPONDER_COMMAND_TIMEOUT_MS:30000}  # 결과 보고 시한이자 전달 시한. 넘기면 TIMEOUT 이고 더는 내려보내지 않는다
