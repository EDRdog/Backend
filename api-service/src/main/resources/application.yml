spring:
  application:
    name: api
  config:
    import:
      - classpath:observability.yml
      - classpath:observability-metrics.yml   # 메트릭 익스포터 켜짐 (build.gradle 에 micrometer-registry-otlp 있음)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/edrdog}
    username: ${DB_USER:edrdog}
    password: ${DB_PASSWORD:edrdog}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: api-demo-arrivals        # 이 서비스가 alerts 를 소비하는 유일한 리스너(데모 도착 계측)
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.edrdog.apiservice.alert.dto.Alert
        spring.json.trusted.packages: com.edrdog.apiservice.alert.dto
    producer:                            # 발표용 데모 수집 API 가 events 로 발행(Protobuf 바이트)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    # 발행/소비 스팬 생성 → Kafka 를 건너도 traceId 가 이어진다
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      concurrency: 3                    # 파티션 수(3)와 맞춘다. 1이면 스레드 하나가 파티션 3개를 순서대로 훑는다

server:
  port: 8084

edrdog:
  kafka:
    alerts-topic: alerts                 # detector 가 발행한 판정 결과 (적재는 archiver, 이 서비스는 데모 계측용으로만 소비)
    events-topic: events                 # 정규화된 이벤트 (collector 와 발표용 데모 수집 API 가 발행 → detector 판정)
    # 파이프라인 상태 화면(operations/health)이 토픽별 컨슈머 lag 를 볼 때 쓰는 컨슈머 그룹 목록(쉼표 구분).
    # 이 서비스가 발행/소비하지 않는 토픽도 여기 있는 이유는, 화면이 파이프라인 전체를 보여주기 때문이다.
    # 토픽 하나를 여러 그룹이 각자 소비하기도 해서(events 는 detector 와 archiver 가, alerts 는 이 서비스와
    # alert-service/archiver-service 가 따로 소비) 토픽당 하나가 아니라 목록으로 둔다. 하나만 잡으면
    # 나머지 소비자가 밀려도 화면에는 "정상"으로 보인다(archiver 가 밀려 ClickHouse 적재가 멈춘 적이 실제로 있었다).
    # 값은 각 서비스(detector-service/archiver-service/alert-service) application.yml 의
    # group-id/application-id 를 그대로 옮겨 적었다. api-demo-arrivals 는 이 서비스의 AlertArrivals 다.
    alerts-consumer-groups: api-demo-arrivals, alert, archiver-alerts
    events-consumer-groups: detector, archiver
  collector:
    url: ${COLLECTOR_URL:http://collector-service}   # 내부 collector-service(등록 노드 조회 대상, ClusterIP). 로컬은 collector-service 의 server.port 로
  api:
    key: ${EDRDOG_API_KEY:dev-api-key}   # 프론트가 X-API-Key 헤더로 보낼 값 (운영은 환경변수로 주입)
  swagger:                               # Swagger 를 가리는 Basic 계정 (운영은 Infisical 주입)
    user: ${EDRDOG_SWAGGER_USER:admin}
    # 기본값을 두지 않는다. 레포에 박으면 그게 곧 공개 비번이다. 없으면 Swagger 는 닫힌다.
    password: ${EDRDOG_SWAGGER_PASSWORD:}
  install:
    # 설치 링크(/i/<토큰>). 사용자가 키를 손으로 다루지 않게 하려고 둔 경로다.
    # 링크의 앞부분. 대시보드가 보여줄 명령줄을 서버가 조립하는 데 쓴다.
    # 브라우저가 API 를 부르는 주소와 같다.
    public-base: ${INSTALL_PUBLIC_BASE:}
    # 에이전트가 붙을 주소(host:port). 위와 다를 수 있다. 에이전트는 api-service 가 아니라
    # 수집 입구인 collector-service 의 TLS 포트로 붙기 때문이다.
    agent-server: ${INSTALL_AGENT_SERVER:}
    # 에이전트 바이너리를 받는 곳. CI 가 릴리스에 올린다(.github/workflows/agent-release.yml).
    download-base: ${INSTALL_DOWNLOAD_BASE:https://github.com/EDRdog/Backend/releases/latest/download}
    # 설치 링크의 수명. 짧게 두는 이유는 링크가 새면 그 시간 동안 남의 기기가 우리 테넌트로
    # 붙을 수 있어서다. 여러 대에 쓸 수 있으므로 한 번에 여러 대 까는 데는 지장이 없다.
    token-ttl-hours: ${INSTALL_TOKEN_TTL_HOURS:24}
  demo:
    # 발표용 시드. 켜면 부팅 시 데모 계정(test/1234, tenantId=1)과 최근 7일치 과거 데이터를 만든다.
    # 운영에 test/1234 가 새면 안 되므로 기본은 off. 발표 환경에서만 DEMO_SEED=true 로 켠다.
    #
    # off 로 막히는 건 시드 쪽(DemoSeeder/DemoDataSeeder/DemoAccountSeeder/DemoEventWriter/DemoAlertWriter)뿐이다.
    # 시연 API 쪽(DemoController/DemoFlowService/EventsProducer/AlertArrivals/DemoTenant)은 off 여도 빈이 뜬다.
    # 막는 장치가 다르다: 데모 계정이 없으면 DemoTenant 가 empty 를 줘서 /api/demo/* 가 403 이 된다(DemoApiWithoutSeedTest).
    # 이 둘을 같다고 보고 조건부 빈을 걷어내면 시드 없이도 쓰기 경로가 열린다.
    seed: ${DEMO_SEED:false}
    # /api/demo/collect 가 판정을 기다리는 상한. Kafka 왕복(발행→스트림즈→alerts)과 ClickHouse 적재를
    # 각각 기다린다. 발표 환경이 느려 TIMEOUT 이 뜨면 늘린다.
    detect-timeout-ms: ${DEMO_DETECT_TIMEOUT_MS:12000}
    store-timeout-ms: ${DEMO_STORE_TIMEOUT_MS:8000}
  cors:
    # 브라우저에서 API 를 호출할 프론트 출처 (쉼표 구분). 기본값은 Vite dev 서버.
    # 배포 시엔 실제 프론트 도메인을 환경변수로 주입한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  internal:
    key: ${INTERNAL_API_KEY:dev-internal-key}   # 서비스 간 내부 조회 전용 키 (프론트 X-API-Key 와 분리, X-Internal-Key 헤더)
  responder:
    url: ${RESPONDER_URL:http://responder-service}   # 내부 responder-service(kill 프록시 대상, ClusterIP). 로컬은 http://localhost:8082
  clickhouse:
    url: ${EDRDOG_CLICKHOUSE_URL:http://localhost:8123}   # 배포 시 clickhouse:8123 주입, 로컬은 host NodePort
    database: edrdog
    user: edrdog
    password: ${CLICKHOUSE_PASSWORD:edrdog}   # 시크릿은 Infisical 주입, 기본값은 로컬 kind ClickHouse 와 일치
    table: edrdog.events                 # 조회 대상 테이블 (archiver 가 적재)
    alerts-table: edrdog.alerts          # 판정기록(불변) 조회 대상 테이블 (archiver 가 적재)
    # 시간 단위 롤업. 원본이 TTL 7일로 사라진 뒤에도 추세는 여기 남는다(180일 보관, archiver 의 MV 가 적재).
    rollup-table: edrdog.events_hourly
    # ClickHouse 로 나가는 HTTP 상한. 빼면 CH 가 느려질 때 톰캣 스레드가 무한정 잡혀 API 전체가 같이 멎는다.
    connect-timeout-ms: ${CLICKHOUSE_CONNECT_TIMEOUT_MS:2000}
    # 조회는 사용자가 화면 앞에서 기다리는 요청이라 짧게 잡는다(데모 store-timeout 8s 안쪽).
    read-timeout-ms: ${CLICKHOUSE_READ_TIMEOUT_MS:5000}
  geoip:
    db-path: ${GEOIP_DB_PATH:}           # GeoLite2-Country.mmdb 외부 경로. 비면 클래스패스 번들 사용, 둘 다 없으면 geo API 빈 배열
